<head>

<title>MPP2 Lernkarten</title>
<style>
  :root{
    --bg:#f5f4f0; --surface:#ffffff; --border:#dedcd4; --border-strong:#c7c4b8;
    --text:#1f1e1c; --text-secondary:#6b6a63; --text-muted:#9a988f;
    --blue-50:#E6F1FB; --blue-600:#185FA5; --blue-800:#0C447C;
    --purple-50:#EEEDFE; --purple-600:#534AB7; --purple-800:#3C3489;
    --teal-50:#E1F5EE; --teal-600:#0F6E56; --teal-800:#085041;
    --coral-50:#FAECE7; --coral-600:#993C1D; --coral-800:#712B13;
    --amber-50:#FAEEDA; --amber-600:#854F0B; --amber-800:#633806;
    --gray-50:#F1EFE8; --gray-600:#5F5E5A; --gray-800:#444441;
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ padding:1rem; max-width:680px; margin:0 auto; padding-bottom:3rem; }
  h1{ font-size:18px; font-weight:600; margin:0.5rem 0 1rem; }
  button{
    font-family:inherit; font-size:14px; background:var(--surface);
    border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:10px 14px; cursor:pointer; color:var(--text);
  }
  button:active{ transform:scale(0.98); }
  button:hover{ background:var(--gray-50); }
  .icon{ font-size:16px; line-height:1; }
  .wk-card{ cursor:pointer; border-radius:12px; padding:1rem 1.25rem; display:flex;
    justify-content:space-between; align-items:center; border:1px solid transparent; }
  .wk-title{ font-size:16px; font-weight:600; }
  .wk-sub{ font-size:13px; margin-top:2px; }
  .wk-range{ font-weight:400; font-size:13px; margin-left:8px; }
  .c-blue{ background:var(--blue-50); color:var(--blue-800); }
  .c-purple{ background:var(--purple-50); color:var(--purple-800); }
  .c-teal{ background:var(--teal-50); color:var(--teal-800); }
  .c-coral{ background:var(--coral-50); color:var(--coral-800); }
  .c-gray{ background:var(--gray-50); color:var(--gray-800); }
  .c-amber{ background:var(--amber-50); color:var(--amber-800); }
  .badge{ font-size:11px; padding:3px 9px; border-radius:var(--radius); font-weight:500; }
  .badge-hoch{ background:var(--coral-50); color:var(--coral-800); }
  .badge-mittel{ background:var(--amber-50); color:var(--amber-800); }
  .badge-niedrig{ background:var(--teal-50); color:var(--teal-800); }
  .topic-row{ cursor:pointer; border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 14px; display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); margin-bottom:8px; }
  .topic-row:hover{ border-color:var(--border-strong); }
  .flip-card{ cursor:pointer; border:1px solid var(--border); border-radius:12px;
    background:var(--surface); min-height:220px; padding:1.5rem; display:flex;
    flex-direction:column; justify-content:center; }
  .flip-card svg{ max-width:100%; height:auto; display:block; margin:0 auto; }
  .stat-row{ display:flex; gap:14px; font-size:12px; color:var(--text-muted); margin-bottom:10px; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row button{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-yes{ background:var(--teal-50); color:var(--teal-800); border:1px solid var(--teal-50); font-weight:500; }
  .btn-no{ background:var(--coral-50); color:var(--coral-800); border:1px solid var(--coral-50); font-weight:500; }
  .back-btn{ margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .done-box{ border-radius:12px; padding:2rem 1.25rem; text-align:center; background:var(--teal-50); color:var(--teal-800); }
</style>
</head>

    { name: "Netzwerktopologien", prio: "hoch", cards: [

      { q: "Was ist das Hauptproblem der Stern-Topologie?", a: "Single Point of Failure (SPoF): fällt der zentrale Knoten (Switch/Hub) aus, ist das gesamte Netzwerk betroffen.", svg: DIAGRAMS.sterntopologie },
      { q: "Was ist der Vorteil der Bus-Topologie und was ihr Nachteil?", a: "Vorteil: geringer Verkabelungsaufwand. Nachteil: bei Kabelbruch fällt das gesamte Segment aus, Kollisionsgefahr bei gleichzeitiger Übertragung.", svg: DIAGRAMS.bustopologie },
      { q: "Was zeichnet die Masch-Topologie aus?", a: "Jeder Knoten ist (teilweise oder vollständig) mit mehreren anderen verbunden → hohe Ausfallsicherheit durch redundante Wege, aber hoher Verkabelungsaufwand.", svg: DIAGRAMS.maschtopologie },
      { q: "Nach welchen Kriterien wählt man eine Netzwerktopologie?", a: "Kosten, Ausfallsicherheit, Skalierbarkeit, Verwaltungsaufwand, benötigte Übertragungsgeschwindigkeit." },
      { q: "Was bedeutet CSMA und wofür wird es eingesetzt?", a: "Carrier Sense Multiple Access: Verfahren, bei dem ein Gerät vor dem Senden prüft, ob das gemeinsame Übertragungsmedium (z. B. bei Bus-Topologie/Ethernet) frei ist, um Kollisionen zu vermeiden. Wichtige Varianten: CSMA/CD (Collision Detection, klassisches Ethernet – Kollision wird erkannt, danach neu gesendet) und CSMA/CA (Collision Avoidance, z. B. WLAN – Kollision wird durch Reservierung des Mediums von vornherein vermieden)." }
    ]},
    { name: "OSI-Schichtenmodell", prio: "hoch", cards: [
      { q: "Nenne die 7 Schichten des OSI-Modells in der richtigen Reihenfolge.", a: "1. Physikalisch (Bitübertragung), 2. Sicherung (MAC/Ethernet), 3. Netzwerk (Routing, IP), 4. Transport (TCP/UDP), 5. Sitzung, 6. Darstellung (Verschlüsselung, Formate), 7. Anwendung (HTTP, FTP, DNS).", svg: DIAGRAMS.osi },
      { q: "Welche Aufgabe hat die Transportschicht (Layer 4)?", a: "Sicherer Datentransport zwischen Endsystemen, Segmentierung großer Datenmengen, Fehlererkennung/-korrektur, Flusskontrolle und Multiplexing (TCP, UDP).", svg: DIAGRAMS.osidatentransport },
      { q: "Wie unterscheidet sich das TCP/IP-Modell vom OSI-Modell?", a: "TCP/IP hat nur 4 Schichten (Network Interface, Internet, Transport, Application) statt 7. OSI ist ein theoretisches Referenzmodell, TCP/IP wird praktisch genutzt; einige OSI-Schichten werden im TCP/IP-Modell zusammengefasst.", svg: DIAGRAMS.osivstcpip },
      { q: "Nenne je einen typischen Angriff auf der Sicherungs-, Netzwerk- und Anwendungsschicht.", a: "Sicherung: MAC-Spoofing/ARP-Spoofing. Netzwerk: IP-Spoofing, DDoS. Anwendung: SQL-Injection, Cross-Site-Scripting (XSS)." },
      { q: "Auf welcher Schicht arbeitet ein Router und auf welcher ein Switch?", a: "Router: Netzwerkschicht (Layer 3, Routing anhand IP-Adressen). Switch: Sicherungsschicht (Layer 2, Weiterleitung anhand MAC-Adressen).", svg: DIAGRAMS.osirouterswitch },
      { q: "Was ist die Aufgabe der Sitzungsschicht (Schicht 5) im OSI-Modell?", a: "Auf- und Abbau sowie Verwaltung von Sitzungen (Sessions) zwischen zwei Kommunikationspartnern: Synchronisation des Datenaustauschs, Wiederaufnahme unterbrochener Verbindungen an definierten Prüfpunkten. In der Praxis (TCP/IP-Modell) wird diese Funktion meist von der Anwendungsschicht mit übernommen." }
    ]},
    { name: "TCP/IP-Modell, TCP vs. UDP", prio: "hoch", cards: [
      { q: "Was ist der Hauptunterschied zwischen TCP und UDP?", a: "TCP: verbindungsorientiert, zuverlässig, mit Fehlerkorrektur und Flusskontrolle (z. B. Webseiten, E-Mail). UDP: verbindungslos, schneller, ohne Zustellgarantie (z. B. Streaming, VoIP, Online-Gaming)." },
      { q: "Nenne je zwei Anwendungsbeispiele für TCP und UDP.", a: "TCP: HTTP/HTTPS, FTP, E-Mail (SMTP). UDP: DNS-Anfragen, Video-Streaming, VoIP." },
      { q: "Was bedeutet 'verbindungsorientiert' bei TCP konkret?", a: "Vor der Datenübertragung wird über einen Handshake (z. B. Three-Way-Handshake) eine Verbindung aufgebaut, Pakete werden bestätigt und bei Verlust erneut gesendet.", svg: DIAGRAMS.handshake }
    ]},
    { name: "IPv4/IPv6, Subnetting", prio: "hoch", cards: [
      { q: "Wie viele Adressen bietet IPv4 und warum reicht das nicht mehr aus?", a: "IPv4 ist 32 Bit lang → ca. 4,3 Milliarden Adressen (2^32). Durch die wachsende Zahl vernetzter Geräte sind die Adressen weitgehend erschöpft.", svg: DIAGRAMS.ipadresse },
      { q: "Was ist der zentrale Vorteil von IPv6 gegenüber IPv4?", a: "128 Bit Adressraum (statt 32 Bit) → praktisch unbegrenzte Anzahl an Adressen, zudem vereinfachtes Header-Format und integrierte Sicherheitsfunktionen (IPSec)." },
      { q: "Was bedeutet CIDR-Notation, z. B. /24?", a: "Classless Inter-Domain Routing: die Zahl gibt an, wie viele Bits der Adresse für das Netzwerk reserviert sind. /24 = 24 Bit Netzanteil, 8 Bit für Hosts → 256 Adressen (254 nutzbar).", svg: DIAGRAMS.cidr },
      { q: "Was ist der Unterschied zwischen öffentlicher und privater IP-Adresse?", a: "Private IP-Adressen (z. B. 192.168.x.x) sind nur innerhalb eines lokalen Netzwerks gültig, öffentliche IP-Adressen sind weltweit eindeutig und im Internet erreichbar." },
      { q: "Vergleiche IPv4 und IPv6 direkt: Gemeinsamkeiten und Unterschiede.", a: "Gemeinsamkeiten: beide identifizieren Geräte eindeutig im Netzwerk, beide werden für Routing verwendet, Koexistenz über Übergangstechniken (Dual Stack, Tunneling) möglich. Unterschiede: IPv4 = 32 Bit (~4,3 Mrd. Adressen, meist dezimal z. B. 192.168.0.1), IPv6 = 128 Bit (praktisch unbegrenzt, hexadezimal z. B. 2001:0db8::1); IPv6 hat ein vereinfachtes Header-Format, integriertes IPSec, keine Notwendigkeit für NAT und unterstützt Auto-Konfiguration von Adressen." }

    { name: "WLAN, Vermittlungsarten, Mehrfachzugriffe", prio: "mittel", cards: [
      { q: "Wie funktioniert WLAN grundlegend und welches Zugriffsverfahren nutzt es?", a: "Kabellose Datenübertragung per Funkwellen zwischen Endgeräten und einem Access Point nach dem Standard IEEE 802.11. Da beim Senden nicht gleichzeitig zugehört werden kann (keine Kollisionserkennung wie bei Kabel), nutzt WLAN CSMA/CA (Collision Avoidance): das Medium wird vor dem Senden abgehört und die Übertragung ggf. reserviert, um Kollisionen von vornherein zu vermeiden." },
      { q: "Was ist der Unterschied zwischen Leitungsvermittlung und Paketvermittlung?", a: "Leitungsvermittlung: für die Dauer der Verbindung wird ein fester, exklusiver Übertragungsweg reserviert (z. B. klassisches Telefonnetz) – garantierte Bandbreite, aber ineffiziente Auslastung. Paketvermittlung: Daten werden in Pakete zerlegt, die unabhängig voneinander und ggf. über unterschiedliche Wege durchs Netz geleitet werden (z. B. Internet/IP) – effizientere Nutzung der Leitungen, keine feste Bandbreitenreservierung." },
      { q: "Wie werden große Datenmengen (z. B. Videos) übers Netzwerk verschickt?", a: "Große Datenmengen werden in kleinere Segmente/Pakete zerlegt (Segmentierung auf Transportschicht, Fragmentierung auf Netzwerkschicht bei zu großer MTU), jedes Paket erhält Kennungen zur richtigen Reihenfolge, wird einzeln über das Netz geroutet und beim Empfänger wieder zusammengesetzt (Reassembly). Bei TCP zusätzlich mit Bestätigung und erneuter Übertragung verlorener Pakete." },

    ]},
    { name: "Hub, Switch, Router", prio: "hoch", cards: [
      { q: "Was ist der Unterschied zwischen Hub und Switch?", a: "Hub: leitet Daten ungefiltert an alle angeschlossenen Geräte weiter (Layer 1, keine Adressierung). Switch: leitet Daten gezielt anhand der MAC-Adresse nur an den Zielport weiter (Layer 2).", svg: DIAGRAMS.hubswitchrouter },
      { q: "Was macht ein Router im Unterschied zu Switch/Hub?", a: "Router verbindet unterschiedliche Netzwerke miteinander und leitet Datenpakete anhand von IP-Adressen weiter (Layer 3, Routing zwischen Netzen).", svg: DIAGRAMS.routerdetail },
      { q: "In welcher OSI-Schicht arbeiten Hub, Switch und Router jeweils?", a: "Hub: Schicht 1 (Physikalisch). Switch: Schicht 2 (Sicherung). Router: Schicht 3 (Netzwerk).", svg: DIAGRAMS.hubswitchrouterschicht }
    ]},
    { name: "Client-Server-Architektur", prio: "mittel", cards: [
      { q: "Was beschreibt die Client-Server-Architektur?", a: "Aufteilung in Client (fordert Dienste/Ressourcen an) und Server (stellt Dienste/Ressourcen bereit), Kommunikation meist über definierte Protokolle (z. B. HTTP).", svg: DIAGRAMS.clientserver },
      { q: "Nenne Vor- und Nachteile der Client-Server-Architektur.", a: "Vorteile: zentrale Verwaltung, klare Rollenverteilung, gute Skalierbarkeit. Nachteile: Server als Single Point of Failure, hohe Serverlast bei vielen Clients." },
      { q: "Wie kann Ausfallsicherheit bei Servern erhöht werden?", a: "Durch Redundanz (mehrere Server im Cluster), Load Balancing, Failover-Mechanismen und regelmäßige Backups." }
    ]},
    { name: "BCG-Matrix", prio: "hoch", cards: [
      { q: "Was ist die BCG-Matrix und welche zwei Dimensionen misst sie?", a: "Portfolioanalyse-Instrument der Boston Consulting Group. Dimensionen: Marktwachstum (y-Achse) und relativer Marktanteil (x-Achse).", svg: DIAGRAMS.bcgmatrix },
      { q: "Welche vier Kategorien gibt es in der BCG-Matrix und wie geht man mit ihnen um?", a: "Stars (hoher Marktanteil, hohes Wachstum → investieren), Cash Cows (hoher Marktanteil, niedriges Wachstum → Gewinne abschöpfen), Question Marks (niedriger Marktanteil, hohes Wachstum → prüfen), Poor Dogs (niedriger Marktanteil, niedriges Wachstum → desinvestieren).", svg: DIAGRAMS.bcgkategorien },
      { q: "Wende die BCG-Matrix beispielhaft auf eine Behörde/Verwaltungsleistung an.", a: "Z. B. ein etabliertes, stark genutztes Verwaltungsportal = Cash Cow; ein neues digitales Pilotprojekt mit wachsender Nachfrage = Question Mark oder Star, je nach Marktdurchdringung.", svg: DIAGRAMS.bcgbehoerde },
      { q: "Was sind die Kritikpunkte an der BCG-Matrix?", a: "Nur zwei Dimensionen betrachtet, andere Einflussfaktoren bleiben unberücksichtigt; Annahme Marktanteil↔Rentabilität nicht immer zutreffend; stark vereinfachte Darstellung." },
      { q: "Wofür wird die BCG-Matrix in der Verwaltung genutzt?", a: "Analyse von Projekten/Dienstleistungen hinsichtlich strategischer Relevanz, Unterstützung von Budget- und Investitionsentscheidungen, Priorisierung bei begrenztem Budget." }
    ]},
    { name: "Unternehmens-/Rechtsformen", prio: "hoch", cards: [
      { q: "Nenne die Hauptgruppen der Unternehmensformen.", a: "Einzelunternehmen, Personengesellschaften (GbR, OHG, KG), Kapitalgesellschaften (GmbH, UG, AG), Sonderformen (Genossenschaften, Körperschaften des öffentlichen Rechts, Stiftungen).", svg: DIAGRAMS.unternehmensformenliste },
      { q: "Schreibe die Abkürzungen GbR, OHG, KG, UG, AG und SE aus.", a: "GbR = Gesellschaft bürgerlichen Rechts. OHG = Offene Handelsgesellschaft. KG = Kommanditgesellschaft. UG = Unternehmergesellschaft (haftungsbeschränkt, 'Mini-GmbH'). AG = Aktiengesellschaft. SE = Societas Europaea (Europäische Gesellschaft)." },
      { q: "Was unterscheidet Personengesellschaften von Kapitalgesellschaften bei der Haftung?", a: "Personengesellschaften: meist unbeschränkte persönliche Haftung der Gesellschafter. Kapitalgesellschaften: Haftung i. d. R. auf das Gesellschaftsvermögen beschränkt." },
      { q: "Was sind die Kernmerkmale einer GmbH?", a: "Kapitalgesellschaft, Mindestkapital 25.000€, beschränkte Haftung der Gesellschafter, Organe: Geschäftsführung und Gesellschafterversammlung." },
      { q: "Zeichne die Unternehmensformen als Baumdiagramm (grobe Struktur).", a: "Unternehmensformen → Einzelunternehmen | Personengesellschaften (GbR, OHG, KG, PartG) | Kapitalgesellschaften (GmbH, UG, AG, SE) | Sonderformen (Genossenschaft, Körperschaft d. ö. Rechts, Stiftung).", svg: DIAGRAMS.unternehmensformen },
      { q: "Nach welchen Kriterien wählt man eine Rechtsform aus?", a: "Haftung (persönlich/beschränkt), Kapitalbedarf, steuerliche Belastung, Mitbestimmung/Entscheidungsfreiheit, Publizitäts- und Berichtspflichten." },
      { q: "Was zeigt ein Organigramm und welche Grundtypen gibt es?", a: "Ein Organigramm stellt die Aufbauorganisation eines Unternehmens grafisch dar: Hierarchieebenen, Abteilungen/Stellen und ihre Weisungsbeziehungen. Grundtypen: Linienorganisation (klare 1:1-Weisungslinien von oben nach unten), Stab-Linien-Organisation (zusätzliche beratende Stabsstellen ohne eigene Weisungsbefugnis), Matrixorganisation (Mitarbeitende unterstehen zwei Leitungslinien gleichzeitig, z. B. fachlich und projektbezogen).", svg: DIAGRAMS.organigramm }
    ]},
    { name: "Rechtsformwahl begründen", prio: "hoch", cards: [
      { q: "Welche Rechtsform würdest du mit 50.000€ Startkapital wählen und warum?", a: "Z. B. GmbH: Mindestkapital (25.000€) ist gedeckt, Haftung ist auf das Gesellschaftsvermögen beschränkt (persönliches Risiko begrenzt), professionelles Auftreten am Markt. Alternative: UG bei geringerem Kapitalbedarf und Wunsch nach schnellerer/günstigerer Gründung." },
      { q: "Warum keine Personengesellschaft bei höherem Startkapital und Risiko?", a: "Wegen der unbeschränkten persönlichen Haftung mit dem Privatvermögen bei OHG/GbR – bei größerem Kapitaleinsatz steigt das persönliche Risiko unverhältnismäßig." },
      { q: "Welche Rolle spielt die geplante Unternehmensgröße bei der Rechtsformwahl?", a: "Kleine, einfache Vorhaben eher Einzelunternehmen/GbR (geringer Gründungsaufwand); wachstumsorientierte oder kapitalintensive Vorhaben eher Kapitalgesellschaften wegen Haftungsbeschränkung und besserer Finanzierungsmöglichkeiten." }
    ]},
    { name: "Bestellverfahren", prio: "hoch", cards: [
      { q: "Wie funktioniert das Bestellpunktverfahren?", a: "Es wird ein fester Meldebestand (Bestellpunkt) definiert; sobald der Lagerbestand diesen erreicht, wird automatisch eine feste Bestellmenge ausgelöst." },
      { q: "Wie funktioniert das Bestellrhythmusverfahren?", a: "Bestellungen erfolgen in festen Zeitabständen (z. B. wöchentlich), die Bestellmenge wird jeweils an den aktuellen Bedarf angepasst, um einen Zielbestand zu erreichen." },
      { q: "Was ist der Hauptunterschied zwischen beiden Verfahren?", a: "Bestellpunktverfahren: fester Bestand löst variable Zeitpunkte aus (mengengesteuert). Bestellrhythmusverfahren: feste Zeitpunkte lösen variable Mengen aus (zeitgesteuert)." }
    ]},
    { name: "Nutzwertanalyse, ABC-Analyse, Stacey-Matrix", prio: "mittel", cards: [
      { q: "Wozu dient die Nutzwertanalyse?", a: "Bewertung mehrerer Alternativen anhand gewichteter Kriterien, um eine strukturierte, nachvollziehbare Entscheidung zu treffen (z. B. Softwareauswahl)." },
      { q: "Was ist das Prinzip der ABC-Analyse?", a: "Klassifizierung von Objekten (z. B. Produkten, Kunden) nach ihrer Bedeutung: A = hoher Wertanteil/wenige Objekte, B = mittlerer Anteil, C = geringer Wertanteil/viele Objekte." },
      { q: "Wofür wird die Stacey-Matrix genutzt?", a: "Einordnung von Projekten nach Grad der Anforderungsklarheit und technologischer Unsicherheit, um die passende Vorgehensweise (klassisch, agil, chaotisch) abzuleiten." }
    ]},
    { name: "PDCA-Zyklus, Kanban wirtschaftlich", prio: "mittel", cards: [
      { q: "Was bedeuten die vier Phasen des PDCA-Zyklus?", a: "Plan (Planung von Maßnahmen), Do (Umsetzung), Check (Überprüfung der Ergebnisse), Act (Anpassung/kontinuierliche Verbesserung) – iterativer Verbesserungskreislauf." },
      { q: "Wofür wird PDCA typischerweise eingesetzt?", a: "Für kontinuierliche Prozessverbesserung, z. B. im Qualitätsmanagement oder in einem ISMS (Informationssicherheits-Managementsystem)." },
      { q: "Wie unterstützt Kanban die kontinuierliche Verbesserung im Sinne von PDCA?", a: "Durch sichtbaren Arbeitsfluss und WIP-Begrenzung werden Engpässe schnell erkannt (Check) und Prozessanpassungen (Act) direkt im laufenden Betrieb vorgenommen." }
    ]},
    { name: "OZG, EGovG, RegMoG", prio: "hoch", cards: [
      { q: "Was versteht man allgemein unter eGovernment?", a: "Nutzung von Informations- und Kommunikationstechnologien zur Abwicklung von Verwaltungsprozessen und zur digitalen Bereitstellung von Verwaltungsleistungen für Bürger, Unternehmen und andere Behörden – Ziel: effizientere, transparentere und leichter zugängliche Verwaltung." },
      { q: "Was ist das Ziel des Onlinezugangsgesetzes (OZG) und seit wann gilt es?", a: "Seit 2017: Verpflichtung von Bund, Ländern und Kommunen, Verwaltungsleistungen digital über Verwaltungsportale anzubieten. Umfasst rund 575 Leistungen in 14 Lebens- und 5 Geschäftslagen." },
      { q: "Was ändert sich mit dem OZG 2.0 (Onlinezugangsgesetz-Novelle)?", a: "Die OZG-Novelle (OZG 2.0, seit 2024) verzichtet auf feste Umsetzungsfristen und Leistungskataloge, fokussiert stattdessen auf Nachnutzung bereits digitalisierter EfA-Leistungen, verpflichtende Standards (z. B. für Formulare/Bezahlfunktionen) und den Aufbau eines Servicekontos für Bund und Länder." },
      { q: "Was ist der 'Einer-für-alle' (EfA)-Ansatz beim OZG?", a: "Ein Bundesland entwickelt eine digitale Lösung für eine Verwaltungsleistung, andere Länder können diese Lösung nachnutzen, statt jeweils eigene zu bauen." },
      { q: "Was regelt das E-Government-Gesetz (EGovG) und seit wann?", a: "Seit 2013: fördert elektronische Verwaltung, u. a. elektronische Aktenführung (E-Akte), elektronische Kommunikation (De-Mail), einheitliche Schnittstellen zwischen Behörden." },
      { q: "Was regelt das ThürEGovG (Thüringer E-Government-Gesetz) und welche 'harten Fakten' sollte man kennen?", a: "Landesgesetz, das die Vorgaben des Bundes-EGovG für Thüringen konkretisiert. Zentrale Punkte: Verpflichtung zur Bereitstellung eines einheitlichen Verwaltungsportals, elektronische Aktenführung (E-Akte) als Regelfall, Möglichkeit zum Einscannen und Ersetzen von Papierakten (ersetzendes Scannen), elektronische Kommunikationswege mit Behörden (z. B. De-Mail/Servicekonto), sowie Barrierefreiheit digitaler Angebote." },
      { q: "Was ist das Ziel des Registermodernisierungsgesetzes (RegMoG) und welches Prinzip steht dahinter?", a: "Seit 2021: Vernetzung/Modernisierung der Register zur effizienteren Datennutzung. Zentrales Prinzip: 'Once-Only' – Bürger geben Daten nur einmal an, Verwaltung nutzt sie mehrfach (über die Steuer-ID als Ordnungsmerkmal)." },
      { q: "Was besagt das EVA-Prinzip und wo ordnet es sich europarechtlich ein?", a: "EVA = Eingabe – Verarbeitung – Ausgabe: Grundprinzip der Datenverarbeitung, wonach jedes System Daten entgegennimmt (Eingabe), diese verarbeitet und ein Ergebnis liefert (Ausgabe). Im Verwaltungskontext ist es die technische Grundlage automatisierter Bescheide/Verfahren. Europarechtlicher Bezug: bei vollautomatisierten Entscheidungen (reine EVA-Verarbeitung ohne menschliches Zutun) greifen die Vorgaben aus Art. 22 DSGVO – Betroffene haben das Recht, nicht ausschließlich einer automatisierten Entscheidung mit rechtlicher Wirkung unterworfen zu werden, sofern keine Ausnahme (z. B. gesetzliche Grundlage, Einwilligung) vorliegt." }
    ]},
    { name: "Digitale Souveränität, eIDAS, Once-Only", prio: "mittel", cards: [
      { q: "Was bedeutet digitale Souveränität für die Verwaltung?", a: "Unabhängigkeit von großen internationalen IT-Anbietern, Förderung europäischer Cloud-Initiativen (z. B. GAIA-X) und Nutzung offener Standards/Open-Source-Software." },
      { q: "Was regelt eIDAS und was ist neu an eIDAS 2.0?", a: "EU-Verordnung für elektronische Identifizierung und Vertrauensdienste (Signaturen, Siegel, Zeitstempel). eIDAS 2.0 (2023) führt die EU Digital Identity Wallet ein, mit Verpflichtung der Mitgliedstaaten zu einer eID-Lösung." },
      { q: "Was besagt das Once-Only-Prinzip?", a: "Bürger und Unternehmen müssen Daten gegenüber der Verwaltung nur einmal angeben; die Verwaltung ruft diese bei Bedarf über verknüpfte Register erneut ab, statt sie mehrfach abzufragen." }
    ]},
    { name: "Beamten-/Tarifrecht", prio: "mittel", cards: [
      { q: "Was ist der Kernunterschied zwischen Beamten und Angestellten im öffentlichen Dienst?", a: "Beamte: besonderes öffentlich-rechtliches Dienstverhältnis (BeamtStG), kein Streikrecht, Treuepflicht, Versorgung nach Alimentationsprinzip. Angestellte: privatrechtlicher Arbeitsvertrag nach Tarifrecht (TVöD), mit Kündigungsschutz nach KSchG." },
      { q: "Was bedeutet das Alimentationsprinzip bei Beamten?", a: "Der Dienstherr ist verpflichtet, dem Beamten und seiner Familie eine angemessene Versorgung zu gewähren – auch im Ruhestand (verfassungsrechtlich verankert, Art. 33 GG).", svg: DIAGRAMS.alimentation },
      { q: "Welche gesetzliche Grundlage regelt den Kündigungsschutz für Angestellte im öffentlichen Dienst?", a: "Kündigungsschutzgesetz (KSchG) in Verbindung mit dem Tarifvertrag für den öffentlichen Dienst (TVöD)." },
      { q: "Was sind Gebietskörperschaften und welche Ebenen gibt es in Deutschland?", a: "Körperschaften des öffentlichen Rechts mit einem festgelegten räumlichen Gebiet und eigener Hoheitsgewalt (Selbstverwaltungsrecht). Drei Ebenen: Bund, Länder und Kommunen (Gemeinden, Landkreise/Kreisfreie Städte) – jede Ebene hat eigene Aufgaben, Organe und Finanzhoheit im Rahmen der verfassungsmäßigen Ordnung." },
      { q: "Was regelt das Vergaberecht und wozu dient es?", a: "Regeln für die Beschaffung von Bau-, Liefer- und Dienstleistungen durch öffentliche Auftraggeber (Behörden). Ziel: transparenter, wirtschaftlicher und diskriminierungsfreier Wettbewerb um öffentliche Aufträge. Wichtige Verfahrensarten: offenes Verfahren (öffentliche Ausschreibung), beschränkte Ausschreibung, freihändige Vergabe – je nach Auftragswert gelten unterschiedliche Schwellenwerte und Vorschriften (z. B. GWB, VgV, UVgO)." },
      { q: "Nenne zentrale Grundsätze, an die sich die (IT-)Verwaltung halten muss.", a: "Rechtmäßigkeit des Verwaltungshandelns (Gesetzmäßigkeit), Wirtschaftlichkeit und Sparsamkeit, Verhältnismäßigkeit, Transparenz, Datenschutz/Datensicherheit, Barrierefreiheit digitaler Angebote, sowie das Once-Only-Prinzip und die Interoperabilität von IT-Systemen zwischen Behörden." }
    ]},
    { name: "BPMN", prio: "mittel", cards: [
      { q: "Was ist BPMN und wozu dient es?", a: "Business Process Model and Notation: Standard zur grafischen, standardisierten Modellierung von Geschäftsprozessen für Fachanwender und IT.", svg: DIAGRAMS.bpmn },
      { q: "Nenne die Hauptelemente von BPMN.", a: "Ereignisse (Start, Zwischen-, Endereignis), Aktivitäten (Task, Sub-Prozess), Gateways (exklusiv/inklusiv/parallel zur Ablaufsteuerung), Sequenz- und Nachrichtenflüsse.", svg: DIAGRAMS.bpmnelemente },
      { q: "Was unterscheidet Pools von Lanes in BPMN?", a: "Pools stellen ganze Organisationen/Systeme dar, Lanes darin repräsentieren Rollen, Abteilungen oder Funktionseinheiten innerhalb eines Pools.", svg: DIAGRAMS.bpmnpoolslanes }
    ]},
    { name: "RAID, Datenstrukturen", prio: "niedrig", cards: [
      { q: "Was ist der Zweck von RAID-Systemen? (RAID ausschreiben)", a: "RAID = Redundant Array of Independent Disks. Zusammenschluss mehrerer Festplatten zur Erhöhung von Datensicherheit (Redundanz) und/oder Geschwindigkeit, z. B. RAID 1 (Spiegelung) oder RAID 5 (Striping mit Parität).", svg: DIAGRAMS.raid },
      { q: "Nenne die wichtigsten RAID-Stufen und erkläre kurz ihr Prinzip.", a: "RAID 0 (Striping): Daten werden ohne Redundanz auf mehrere Platten verteilt → hohe Geschwindigkeit, aber kein Ausfallschutz. RAID 1 (Spiegelung): identische Daten auf zwei Platten → hohe Ausfallsicherheit, halbierte Nutzkapazität. RAID 5 (Striping + Parität): Daten und Prüfsummen (Parität) verteilt über mind. 3 Platten → guter Kompromiss aus Geschwindigkeit und Redundanz, eine Platte darf ausfallen. RAID 10 (1+0): Kombination aus Spiegelung und Striping → hohe Geschwindigkeit und Ausfallsicherheit, aber hoher Plattenbedarf.", svg: DIAGRAMS.raidstufen },
      { q: "Was ist der Unterschied zwischen einer verketteten Liste und einem Binärbaum bezüglich der Suche?", a: "Liste: lineare Suche, im schlechtesten Fall O(n). Binärer Suchbaum: bei ausgeglichenem Baum O(log n), da bei jedem Schritt die Suchmenge halbiert wird.", svg: DIAGRAMS.listevsbaum }
    ]},
    { name: "Lasten-/Pflichtenheft, Systemanalyse", prio: "niedrig", cards: [
      { q: "Was unterscheidet Lastenheft und Pflichtenheft?", a: "Lastenheft: vom Auftraggeber formuliert, beschreibt das 'Was' (Anforderungen/Ziele). Pflichtenheft: vom Auftragnehmer erstellt, beschreibt das 'Wie' (konkrete Umsetzung der Anforderungen)." },
      { q: "Was ist der Zweck einer Systemanalyse zu Projektbeginn?", a: "Erhebung und Analyse der Ist-Situation sowie der Anforderungen, um eine fundierte Grundlage für Planung, Aufwandsschätzung und Systementwurf zu schaffen." }
    ]}
  ]
},
week2: {
  label: "Woche 2", range: "10.–14.8. (Mo–Fr)", color: "purple",
  topics: [
    { name: "Scrum", prio: "hoch", cards: [
      { q: "Welche Rollen gibt es in Scrum und was ist ihre Aufgabe?", a: "Product Owner: verantwortet das Product Backlog und Priorisierung. Scrum Master: sorgt für Einhaltung des Scrum-Prozesses, beseitigt Hindernisse. Entwicklungsteam: setzt die Arbeit im Sprint um.", svg: DIAGRAMS.scrumrollen },
      { q: "Was sind die Artefakte in Scrum?", a: "Product Backlog (priorisierte Gesamtliste der Anforderungen), Sprint Backlog (Aufgaben für den aktuellen Sprint), Increment (fertiges Produktinkrement am Sprintende).", svg: DIAGRAMS.scrumartefakte },
      { q: "Welche Events (Meetings) gibt es in Scrum?", a: "Sprint Planning (Sprintstart, Ziel & Aufgaben festlegen), Daily Scrum (tägliches 15-Min-Stand-up), Sprint Review (Ergebnispräsentation), Sprint Retrospective (Prozessreflexion im Team).", svg: DIAGRAMS.scrum },
      { q: "Wie lange dauert typischerweise ein Sprint?", a: "Meist 2–4 Wochen, fest getaktet und über das gesamte Projekt konstant." },
      { q: "Wann sollte man Scrum statt Wasserfall wählen?", a: "Scrum bei dynamischen Projekten mit unsicheren/sich ändernden Anforderungen und frühem Feedback-Bedarf; Wasserfall bei stabilen, klar definierten Anforderungen." }
    ]},
    { name: "Wasserfallmodell", prio: "hoch", cards: [
      { q: "Wie ist das Wasserfallmodell aufgebaut?", a: "Lineares, sequenzielles Vorgehen in Phasen: Analyse, Design, Implementierung, Test, Betrieb. Jede Phase muss abgeschlossen sein, bevor die nächste beginnt.", svg: DIAGRAMS.wasserfall },
      { q: "Was sind Vor- und Nachteile des Wasserfallmodells?", a: "Vorteile: klare Struktur, einfache Planung, gute Dokumentation. Nachteile: geringe Flexibilität, spätes Erkennen von Fehlern, schwierig bei sich ändernden Anforderungen.", svg: DIAGRAMS.wasserfallvornachteil },
      { q: "Wo wird das Wasserfallmodell typischerweise eingesetzt?", a: "Bei Projekten mit stabilen Anforderungen, z. B. standardisierte Verwaltungssoftware." }
    ]},
    { name: "V-Modell / V-Modell XT", prio: "hoch", cards: [
      { q: "Wie ist das V-Modell aufgebaut?", a: "Darstellung in V-Form: linke Seite = Spezifikation (Anforderungen, Architektur, Design), rechte Seite = Testen/Validieren auf jeder Spezifikationsebene.", svg: DIAGRAMS.vmodell },
      { q: "Welche Phasen umfasst das V-Modell?", a: "Anforderungsanalyse, System- und Softwaredesign, Implementierung, Modultests, Integrationstests, Systemtests, Abnahmetests.", svg: DIAGRAMS.vmodellphasen },
      { q: "Was ist das V-Modell XT und wo wird es verpflichtend eingesetzt?", a: "Weiterentwicklung/Standardisierung des klassischen V-Modells, modular und anpassbar an Projekttyp/-größe. Verpflichtend bei vielen öffentlichen IT-Projekten in Deutschland." },
      { q: "Welche Vor- und Nachteile hat das V-Modell?", a: "Vorteile: klare Struktur, Verknüpfung von Spezifikation und Test, geeignet für sicherheitskritische Projekte. Nachteile: wenig flexibel bei Änderungen, hoher Dokumentationsaufwand.", svg: DIAGRAMS.vmodellvornachteil },
      { q: "Wo wird das V-Modell eingesetzt?", a: "Öffentliche Verwaltung, Verteidigungsprojekte, kritische Infrastrukturen, Software- und Systementwicklung." }
    ]},
    { name: "Kanban / Scaled Agile", prio: "mittel", cards: [
      { q: "Was ist Kanban und wie funktioniert es?", a: "Methode zur Visualisierung und Steuerung von Arbeitsprozessen. Aufgaben werden auf Boards (To Do, In Progress, Done) dargestellt, kontinuierlicher Fluss statt fester Sprints.", svg: DIAGRAMS.kanban },
      { q: "Wie misst man den Fortschritt in Kanban?", a: "Mit Kennzahlen wie Durchlaufzeit (Cycle Time), Work in Progress (WIP) und Lead Time." },
      { q: "Wie skaliert man Scrum für große Projekte?", a: "Durch agile Skalierungsframeworks wie SAFe (Scaled Agile Framework), LeSS (Large Scale Scrum) oder Nexus." }
    ]},
    { name: "Spiralmodell & Vorgehensmodelle allgemein", prio: "mittel", cards: [
      { q: "Was ist das Grundprinzip des Spiralmodells?", a: "Iteratives, risikogetriebenes Vorgehensmodell: in wiederholten Zyklen werden Planung, Risikoanalyse, Entwicklung und Bewertung durchlaufen, wobei jede Spirale das System weiter ausbaut.", svg: DIAGRAMS.spiralmodell },
      { q: "Was unterscheidet lineare von agilen Vorgehensmodellen grundsätzlich?", a: "Lineare Modelle (Wasserfall, V-Modell) durchlaufen feste, aufeinanderfolgende Phasen ohne Rücksprünge. Agile Modelle (Scrum, Kanban) arbeiten iterativ-inkrementell mit häufigem Feedback und Anpassung." },
      { q: "Nenne je einen typischen Einsatzfall für ein schwergewichtiges und ein leichtgewichtiges Vorgehensmodell.", a: "Schwergewichtig (z. B. V-Modell XT): große, sicherheitskritische Verwaltungsprojekte mit hohem Dokumentationsbedarf. Leichtgewichtig (z. B. Scrum/Kanban): kleinere Teams, dynamische Anforderungen, schnelle Iteration." }
    ]},
    { name: "Von-Neumann-Architektur", prio: "hoch", cards: [
      { q: "Aus welchen Hauptkomponenten besteht die Von-Neumann-Architektur?", a: "CPU (mit Rechenwerk/ALU, Steuerwerk, Registern), gemeinsamer Speicher für Daten und Programme, gemeinsamer Systembus für Daten, Adressen und Steuerinformationen.", svg: DIAGRAMS.vonneumann },
      { q: "Was ist der Von-Neumann-Flaschenhals?", a: "Da nur ein gemeinsamer Bus für Befehle und Daten existiert, entsteht ein Engpass: CPU muss Befehle und Daten nacheinander über denselben Bus holen, was die parallele Verarbeitung begrenzt.", svg: DIAGRAMS.vonneumannflaschenhals },
      { q: "Nenne Beispiele für Von-Neumann-Systeme.", a: "Klassische PCs, Standard-CPUs (Intel x86, AMD Ryzen), Laptops, Server, historische Rechner wie ENIAC." },
      { q: "Zeichne/beschreibe den Aufbau: welche Komponenten sind wie verbunden?", a: "CPU (ALU, Steuerwerk, Register) ↔ Systembus ↔ gemeinsamer Speicher (Programme + Daten) ↔ Systembus ↔ Ein-/Ausgabewerk. Alle Komponenten teilen sich denselben Bus.", svg: DIAGRAMS.vonneumannverbindung },
      { q: "Was ist der zentrale Vorteil der Von-Neumann-Architektur trotz des Flaschenhalses?", a: "Hohe Flexibilität, da Speicher dynamisch zwischen Daten und Programmen aufgeteilt werden kann, sowie einfacherer und günstigerer Aufbau." }
    ]},
    { name: "Harvard-Architektur & Vergleich", prio: "mittel", cards: [
      { q: "Was unterscheidet die Harvard- von der Von-Neumann-Architektur?", a: "Harvard nutzt getrennte Speicherbereiche und getrennte Busse für Programme und Daten (paralleler Zugriff möglich), Von-Neumann nutzt einen gemeinsamen Speicher und Bus.", svg: DIAGRAMS.harvard },
      { q: "Welche Vor- und Nachteile hat die Harvard-Architektur?", a: "Vorteile: höhere Geschwindigkeit durch parallelen Zugriff, kein Bus-Engpass, gut für Echtzeitsysteme. Nachteile: komplexere Hardware, weniger flexible Speicheraufteilung." },
      { q: "Nenne Beispiele für Harvard-Architektur-Systeme.", a: "Mikrocontroller (PIC, Arduino/Atmel AVR), digitale Signalprozessoren (DSPs), ARM Cortex-M (modifizierte Harvard-Architektur), eingebettete Systeme." }
    ]},
    { name: "RISC/CISC, Pipelining, Taktfrequenz", prio: "mittel", cards: [
      { q: "Was unterscheidet RISC von CISC grundsätzlich?", a: "RISC (Reduced Instruction Set Computer): wenige, einfache Befehle, schnelle Ausführung, energieeffizienter. CISC (Complex Instruction Set Computer): viele komplexe Befehle, mehr Funktionalität pro Befehl, aber höherer Energieverbrauch.", svg: DIAGRAMS.riscvscisc },
      { q: "Was ist Pipelining und welchen Vorteil bringt es?", a: "Überlappende Ausführung mehrerer Befehle in aufeinanderfolgenden Verarbeitungsstufen (z. B. Fetch, Decode, Execute), wodurch der Befehlsdurchsatz erhöht wird, ohne die Taktfrequenz zu steigern.", svg: DIAGRAMS.pipelining },
      { q: "Wie hoch ist die typische Taktfrequenz eines aktuellen Prozessors?", a: "Meist im Bereich von ca. 2–5 GHz für Consumer-CPUs, teils höher im Turbo-Modus." }
    ]},
    { name: "Befehlszyklus, Speicherhierarchie, Interrupts", prio: "mittel", cards: [
      { q: "Beschreibe den Befehlszyklus (Fetch-Decode-Execute-Zyklus) einer CPU.", a: "1. Fetch: Befehl wird aus dem Speicher anhand des Befehlszählers (Program Counter) geladen. 2. Decode: Steuerwerk entschlüsselt den Befehl. 3. Execute: ALU/Steuerwerk führen den Befehl aus. 4. (Store: Ergebnis wird ggf. zurückgeschrieben.) Danach wird der Befehlszähler erhöht und der Zyklus beginnt erneut.", svg: DIAGRAMS.befehlszyklus },
      { q: "Was ist die Speicherhierarchie und wie ist sie aufgebaut?", a: "Anordnung von Speichertypen nach Geschwindigkeit, Kosten und Kapazität: Register (schnellster, kleinster, teuerster) → Cache (L1/L2/L3) → Arbeitsspeicher (RAM) → Festplatte/SSD → externe Speicher/Archiv (langsamster, größter, günstigster). Ziel: schnelle, häufig genutzte Daten möglichst nah an der CPU halten.", svg: DIAGRAMS.speicherhierarchie },
      { q: "Was ist ein Interrupt und wozu dient er?", a: "Ein Unterbrechungssignal, das den normalen Programmablauf der CPU stoppt, um ein dringendes Ereignis sofort zu behandeln (z. B. Tastatureingabe, Netzwerkpaket, Hardwarefehler). Nach Abarbeitung der Interrupt-Routine wird der ursprüngliche Programmzustand wiederhergestellt und fortgesetzt." },
      { q: "Was ist der Unterschied zwischen ROM und RAM?", a: "ROM (Read-Only Memory): nichtflüchtiger Speicher, Inhalt bleibt auch ohne Strom erhalten, meist nur lesbar (z. B. BIOS/Firmware). RAM (Random Access Memory): flüchtiger Arbeitsspeicher, Inhalt geht bei Stromverlust verloren, schneller Lese-/Schreibzugriff für laufende Programme und Daten." },
      { q: "Was versteht man allgemein unter 'Memory' im Rechnerkontext und welche Arten gibt es?", a: "Speicher zur Ablage von Daten und Programmen. Hauptarten: Primärspeicher (Arbeitsspeicher/RAM, flüchtig, schnell), Sekundärspeicher (Festplatte/SSD, nichtflüchtig, langsamer), Cache (sehr schnell, zwischen CPU und RAM), Register (in der CPU selbst, am schnellsten)." }
    ]},
    { name: "Bussysteme", prio: "mittel", cards: [
      { q: "Was ist ein Bussystem und welche Bus-Arten unterscheidet man?", a: "Ein Bussystem verbindet Komponenten eines Rechners zum Datenaustausch. Hauptarten: Datenbus (überträgt die eigentlichen Daten), Adressbus (überträgt Speicheradressen, gibt an 'wohin/woher'), Steuerbus (überträgt Steuersignale wie Lese-/Schreibbefehle, Takt).", svg: DIAGRAMS.bussysteme },
      { q: "Zeichne/beschreibe, wie CPU, Speicher und Ein-/Ausgabe über Busse verbunden sind.", a: "CPU ist über Datenbus, Adressbus und Steuerbus mit Arbeitsspeicher und den Ein-/Ausgabeeinheiten verbunden. Bei Von-Neumann teilen sich Programm und Daten denselben Bus (Flaschenhals), bei Harvard existieren getrennte Busse für Programme und Daten.", svg: DIAGRAMS.bussystemverbindung }
    ]},
    { name: "Hardware-Schnittstellen & Speichermedien", prio: "niedrig", cards: [
      { q: "Erkläre kurz PCI und SATA.", a: "PCI (Peripheral Component Interconnect): interner Bus-Standard zum Anschluss von Erweiterungskarten (Grafik-, Netzwerkkarten) an das Mainboard, heute meist als PCIe (PCI Express). SATA (Serial ATA): Schnittstellenstandard zum Anschluss von Festplatten/SSDs ans Mainboard, löste das ältere parallele ATA/IDE ab." },
      { q: "Erkläre kurz SCSI und USB.", a: "SCSI (Small Computer System Interface): älterer Standard zum Anschluss mehrerer Peripheriegeräte (v. a. Festplatten, Server/Storage-Bereich), weitgehend von SATA/SAS abgelöst. USB (Universal Serial Bus): weit verbreiteter serieller Standard für externe Geräte (Speicher, Eingabegeräte, Peripherie), unterstützt Hot-Plugging und verschiedene Geschwindigkeitsklassen (USB 2.0/3.x/4)." },
      { q: "Erkläre kurz HDMI und DDR.", a: "HDMI (High Definition Multimedia Interface): digitale Schnittstelle zur Übertragung von Bild und Ton in hoher Qualität (z. B. PC an Monitor/TV). DDR (Double Data Rate): Bauart von Arbeitsspeicher (RAM), bei der Daten sowohl bei steigender als auch fallender Taktflanke übertragen werden → doppelte effektive Datenrate gegenüber SDR." },
      { q: "Was ist der Unterschied zwischen HD und SSD?", a: "HD/HDD (Hard Disk Drive): magnetische, mechanische Festplatte mit rotierenden Scheiben und Schreib-/Lesekopf – günstiger pro GB, aber langsamer und mechanisch störanfälliger. SSD (Solid State Drive): Speicher auf Flash-Speicher-Basis ohne bewegliche Teile – deutlich schneller, robuster, aber teurer pro GB." },
      { q: "Was ist RFID und wofür wird es genutzt?", a: "Radio-Frequency Identification: Technik zur berührungslosen Identifikation/Datenübertragung über Funkwellen zwischen einem Transponder (Tag) und einem Lesegerät, z. B. für Zutrittskontrollen, Warenwirtschaft, kontaktloses Bezahlen." },
      { q: "Was ist ASCII?", a: "American Standard Code for Information Interchange: Zeichenkodierungsstandard, der 128 Zeichen (Buchstaben, Ziffern, Sonderzeichen, Steuerzeichen) jeweils auf einen 7-Bit-Wert abbildet – Grundlage vieler späterer Kodierungen wie UTF-8." }
    ]},
    { name: "Zahlensysteme umrechnen", prio: "hoch", cards: [
      { q: "Wie rechnet man eine Dezimalzahl in Binär um?", a: "Fortlaufende Division durch 2, die Reste (von unten nach oben gelesen) ergeben die Binärzahl. Beispiel: 13 → 1101." },
      { q: "Rechne dein Alter in Binär um (Beispielrechnung 25).", a: "25 = 16+8+1 = 2⁴+2³+2⁰ → Binär: 11001." },
      { q: "Wie funktioniert die Umrechnung Binär → Hexadezimal?", a: "Binärzahl in 4er-Blöcke von rechts gruppieren, jeden Block einzeln in eine Hex-Ziffer (0–F) umwandeln. Beispiel: 1101 1010 → D A → 0xDA." },
      { q: "Was ist der Unterschied zwischen Bit und Byte?", a: "1 Bit = kleinste Informationseinheit (0 oder 1). 1 Byte = 8 Bit, kleinste adressierbare Speichereinheit." }
    ]},
    { name: "ER-Modell", prio: "hoch", cards: [
      { q: "Was beschreibt ein ER-Modell?", a: "Abbildung von Daten und ihren Beziehungen als Entitäten, Attribute und Relationen – Grundlage für die Datenbankmodellierung.", svg: DIAGRAMS.ermodell },
      { q: "Welche Kardinalitätsarten gibt es und was bedeuten sie?", a: "1:1 (jede Entität höchstens einer anderen zugeordnet), 1:n (eine Entität kann mit mehreren verbunden sein), n:m (mehrere Entitäten beider Seiten können verknüpft sein, benötigt Zwischentabelle).", svg: DIAGRAMS.erkardinalitaeten },
      { q: "Wie wird eine n:m-Beziehung in ein relationales Schema umgesetzt?", a: "Über eine Zwischentabelle (Verknüpfungstabelle), die die Primärschlüssel beider beteiligter Tabellen als Fremdschlüssel enthält.", svg: DIAGRAMS.ernmauflösung },
      { q: "Wie hängen ER-Modell und Objektorientierung zusammen?", a: "Entitäten entsprechen Klassen, Attribute entsprechen Eigenschaften, Beziehungen entsprechen Assoziationen, Generalisierung/Spezialisierung entspricht Vererbung." }
    ]},
    { name: "DBMS-Grundlagen, Datenunabhängigkeit", prio: "mittel", cards: [
      { q: "Was ist ein Datenbankmanagementsystem (DBMS) und welche Aufgaben hat es?", a: "Software zur Verwaltung von Datenbanken: Speichern, Abfragen, Ändern und Löschen von Daten, Sicherstellung von Konsistenz, Zugriffskontrolle, Mehrbenutzerbetrieb und Ausfallsicherheit (z. B. MySQL, PostgreSQL, Oracle)." },
      { q: "Was bedeutet Datenunabhängigkeit in Datenbanksystemen?", a: "Trennung zwischen der logischen Struktur der Daten (wie Anwendungen die Daten sehen) und der physischen Speicherung. Änderungen an der physischen Speicherung (z. B. Index hinzufügen) wirken sich nicht auf Anwendungsprogramme aus (physische Datenunabhängigkeit); Änderungen am logischen Schema wirken sich nicht auf einzelne Anwendungssichten aus (logische Datenunabhängigkeit)." },
      { q: "Was sind die drei Ebenen des Datenbankentwurfs?", a: "1. Konzeptioneller Entwurf: fachliches ER-Modell, unabhängig von Technik. 2. Logischer Entwurf: Umsetzung in ein konkretes Datenmodell (z. B. relationales Schema mit Tabellen). 3. Physischer Entwurf: technische Umsetzung im DBMS (Indizes, Speicherorganisation, Performance-Optimierung)." },
      { q: "Was besagen die ACID-Eigenschaften einer Datenbank-Transaktion?", a: "Atomicity (Atomarität): Transaktion wird ganz oder gar nicht ausgeführt. Consistency (Konsistenz): Datenbank bleibt in einem gültigen Zustand. Isolation: parallele Transaktionen beeinflussen sich nicht gegenseitig. Durability (Dauerhaftigkeit): einmal bestätigte Änderungen bleiben auch nach einem Systemausfall erhalten." },
      { q: "Was ist referentielle Integrität?", a: "Sicherstellung, dass Fremdschlüssel-Beziehungen zwischen Tabellen konsistent bleiben – z. B. darf kein Datensatz auf einen nicht existierenden Datensatz einer anderen Tabelle verweisen. Wird vom DBMS über Fremdschlüssel-Constraints durchgesetzt." }
    ]},
    { name: "SQL Grundlagen", prio: "mittel", cards: [
      { q: "Wie sieht eine einfache SELECT-Abfrage aus, die alle Kunden aus Berlin liefert?", a: "SELECT * FROM Kunden WHERE Stadt = 'Berlin';" },
      { q: "Wie fügt man mit SQL einen neuen Datensatz ein?", a: "INSERT INTO Tabelle (Spalte1, Spalte2) VALUES (Wert1, Wert2);" },
      { q: "Was macht ein JOIN und nenne einen Grundtyp.", a: "Verknüpft Zeilen aus zwei oder mehr Tabellen anhand eines gemeinsamen Schlüssels. INNER JOIN liefert nur Zeilen, die in beiden Tabellen übereinstimmende Werte haben." }
    ]},
    { name: "Betriebssystem, Compiler/Interpreter, Sprachen", prio: "niedrig", cards: [
      { q: "Was sind die Kernaufgaben eines Betriebssystems?", a: "Verwaltung der Hardware-Ressourcen (Prozessor, Speicher, Ein-/Ausgabegeräte), Bereitstellung einer einheitlichen Schnittstelle für Anwendungsprogramme, Prozess- und Speicherverwaltung, Dateiverwaltung, Nutzerverwaltung/Rechtevergabe (z. B. Windows, Linux, macOS)." },
      { q: "Was ist der Unterschied zwischen Compiler und Interpreter?", a: "Compiler: übersetzt den gesamten Quellcode vor der Ausführung in Maschinencode (schneller zur Laufzeit, z. B. C/C++). Interpreter: liest und führt den Quellcode Zeile für Zeile zur Laufzeit aus, ohne vollständige Vorab-Übersetzung (flexibler, aber langsamer, z. B. Python, JavaScript)." },
      { q: "Was ist die Backus-Naur-Form (BNF)?", a: "Eine formale Notation zur Beschreibung der Syntax (Grammatik) von Programmiersprachen und formalen Sprachen, bestehend aus Regeln der Form Symbol ::= Ausdruck, die rekursiv definieren, welche Zeichenketten zur Sprache gehören." },
      { q: "Was ist ein endlicher Automat und wofür wird er genutzt?", a: "Ein abstraktes Modell mit endlich vielen Zuständen, das anhand von Eingaben zwischen Zuständen wechselt (Zustandsübergänge). Wird u. a. zur Beschreibung von Sprachen/Grammatiken, in Compilern (lexikalische Analyse) und zur Modellierung von Abläufen (z. B. Ampelsteuerung, Workflow-Zustände) eingesetzt." },
      { q: "Kurz erklärt: was sind HTML, CSS und C++?", a: "HTML (HyperText Markup Language): Auszeichnungssprache zur Strukturierung von Webseiteninhalten. CSS (Cascading Style Sheets): Sprache zur Gestaltung/Formatierung von HTML-Inhalten (Layout, Farben, Schriften). C++: kompilierte, objektorientierte Programmiersprache mit hoher Performance, u. a. für Systemsoftware, Spiele, eingebettete Systeme." }
    ]},
    { name: "Sortieralgorithmen, Datenkompression, Filesysteme", prio: "niedrig", cards: [
      { q: "Nenne zwei klassische Sortieralgorithmen und ihre grundlegende Funktionsweise.", a: "Bubble Sort: vergleicht wiederholt benachbarte Elemente und vertauscht sie bei falscher Reihenfolge, bis die Liste sortiert ist (einfach, aber ineffizient, O(n²)). Quicksort: wählt ein Pivot-Element, teilt die Liste in kleinere/größere Elemente auf und sortiert die Teile rekursiv (im Schnitt deutlich schneller, O(n log n))." },
      { q: "Was ist Datenkompression und welche zwei Grundarten gibt es?", a: "Reduktion der Datenmenge zur Speicher-/Übertragungsersparnis. Verlustfreie Kompression: Originaldaten können exakt wiederhergestellt werden (z. B. ZIP, PNG) – wichtig bei Texten/Programmen. Verlustbehaftete Kompression: entfernt für den Menschen kaum wahrnehmbare Informationen dauerhaft, höhere Kompressionsrate (z. B. JPEG, MP3)." },
      { q: "Was ist ein Dateisystem (z. B. FAT) und wozu dient es?", a: "Struktur, mit der ein Betriebssystem Dateien auf einem Speichermedium organisiert, benennt und wiederfindet (Verzeichnisse, Metadaten, Speicherorte). FAT (File Allocation Table): einfaches, älteres Dateisystem mit einer Tabelle, die verzeichnet, welche Speicherblöcke zu welcher Datei gehören – weit verbreitet bei USB-Sticks/SD-Karten wegen breiter Kompatibilität." }
    ]},
    { name: "Data Warehouse, BI, ETL", prio: "mittel", cards: [
      { q: "Was ist ein Data Warehouse?", a: "Zentrale, historisierte Datenbank, die Daten aus verschiedenen Quellsystemen konsolidiert für Analyse- und Reportingzwecke (Business Intelligence)." },
      { q: "Was passiert in den drei Phasen des ETL-Prozesses?", a: "Extract (Daten aus Quellsystemen extrahieren), Transform (Daten bereinigen/vereinheitlichen), Load (Daten ins Data Warehouse laden)." },
      { q: "Was ist der Unterschied zwischen Star- und Snowflake-Schema?", a: "Star-Schema: zentrale Faktentabelle direkt mit denormalisierten Dimensionstabellen verbunden (einfach, schnell). Snowflake-Schema: Dimensionstabellen sind zusätzlich normalisiert/verzweigt (weniger Redundanz, komplexer).", svg: DIAGRAMS.starschema }
    ]},
    { name: "Big Data, OLAP vs. OLTP", prio: "mittel", cards: [
      { q: "Was sind die 5 V's von Big Data?", a: "Volume (Menge), Variety (Vielfalt), Velocity (Geschwindigkeit), Veracity (Qualität/Verlässlichkeit), Value (Nutzen)." },
      { q: "Was ist der Unterschied zwischen OLAP und OLTP?", a: "OLTP (Online Transaction Processing): viele kleine, schnelle Transaktionen im operativen Tagesgeschäft (z. B. Bestellungen buchen). OLAP (Online Analytical Processing): komplexe Analysen großer historischer Datenmengen für Reporting/Entscheidungen." },
      { q: "Nenne zwei typische Techniken des Data Mining.", a: "Klassifikation (Zuordnung zu Kategorien), Clustering (Gruppierung ähnlicher Datenpunkte); auch Assoziationsanalyse und Anomalieerkennung." }
    ]},
    { name: "Cloud-Computing", prio: "hoch", cards: [
      { q: "Erkläre die drei Servicemodelle SaaS, PaaS und IaaS.", a: "IaaS (Infrastructure as a Service): virtuelle Hardware-Ressourcen (Server, Speicher). PaaS (Platform as a Service): Entwicklungsplattform inkl. Betriebssystem/Laufzeitumgebung. SaaS (Software as a Service): fertige Anwendungssoftware über das Internet.", svg: DIAGRAMS.saaspaasiaas },
      { q: "Was sind Vor- und Nachteile von Cloud-Computing für die Verwaltung?", a: "Vorteile: Skalierbarkeit, Kosteneffizienz, keine eigene Hardware-Wartung. Nachteile: Abhängigkeit vom Anbieter, Datenschutz-/Sicherheitsfragen, ggf. Cloud-Act-Problematik bei US-Anbietern." },
      { q: "Welche rechtlichen Aspekte sind beim Cloud-Einsatz in der Verwaltung besonders relevant?", a: "DSGVO-Konformität, Datenhoheit/Speicherort der Daten, Auftragsverarbeitungsverträge, Risiken durch extraterritoriale Gesetze wie den US Cloud Act." },
      { q: "Was ist der Unterschied zwischen Cloud und On-Premises?", a: "On-Premises: eigene Server/Infrastruktur im eigenen Rechenzentrum, volle Kontrolle, hoher eigener Wartungsaufwand. Cloud: Infrastruktur wird von externem Anbieter bereitgestellt und gewartet, flexibel skalierbar." }
    ]},
    { name: "Virtualisierung, Container, Cluster", prio: "mittel", cards: [
      { q: "Was ist Virtualisierung und welchen Vorteil bringt sie?", a: "Abstraktion physischer Hardware, um mehrere virtuelle Maschinen auf einer physischen Maschine zu betreiben. Vorteil: bessere Ressourcenauslastung, Isolation, Flexibilität." },
      { q: "Was ist der Unterschied zwischen VM und Container?", a: "VM: vollständiges eigenes Betriebssystem pro Instanz (Hypervisor-basiert), ressourcenintensiver. Container: teilen sich den Betriebssystem-Kernel des Hosts, leichtgewichtiger und schneller startbar (z. B. Docker).", svg: DIAGRAMS.vmcontainer },
      { q: "Was ist ein Cluster und wofür wird es eingesetzt?", a: "Verbund mehrerer Rechner, die zusammenarbeiten, um Leistung und/oder Ausfallsicherheit zu erhöhen (z. B. Load-Balancing-Cluster, High-Availability-Cluster)." }
    ]}
  ]
},
week3: {
  label: "Woche 3", range: "17.–21.8. (Mo–Fr)", color: "teal",
  topics: [
    { name: "OOP-Säulen", prio: "hoch", cards: [
      { q: "Wofür steht die Abkürzung OOP?", a: "Objektorientierte Programmierung: Programmierparadigma, bei dem Daten und zugehörige Funktionen in Objekten (Instanzen von Klassen) gebündelt werden." },
      { q: "Was ist Kapselung (Encapsulation)?", a: "Bündelung von Daten und Methoden in einer Klasse, Zugriff von außen wird über definierte Schnittstellen (z. B. public/private) kontrolliert." },
      { q: "Was ist Vererbung (Inheritance)?", a: "Eine Klasse (Subklasse) übernimmt Eigenschaften und Methoden einer anderen Klasse (Superklasse) und kann sie erweitern oder überschreiben." },
      { q: "Was ist Polymorphie (Polymorphism)?", a: "Objekte unterschiedlicher Klassen können über dieselbe Schnittstelle angesprochen werden, verhalten sich aber je nach tatsächlichem Typ unterschiedlich (z. B. überschriebene Methoden)." },
      { q: "Was ist Abstraktion?", a: "Reduktion auf die wesentlichen Eigenschaften eines Objekts, Ausblenden von Implementierungsdetails, z. B. über abstrakte Klassen oder Interfaces." },
      { q: "Wie hängen die vier Säulen zusammen?", a: "Abstraktion definiert das Wesentliche, Kapselung schützt die Umsetzung, Vererbung ermöglicht Wiederverwendung, Polymorphie erlaubt flexible Nutzung verschiedener Implementierungen über eine gemeinsame Schnittstelle." }
    ]},
    { name: "UML-Klassendiagramm", prio: "hoch", cards: [
      { q: "Wofür steht die Abkürzung UML?", a: "Unified Modeling Language: standardisierte, grafische Modellierungssprache zur Darstellung von Strukturen (z. B. Klassendiagramm) und Abläufen (z. B. Sequenzdiagramm) in der Softwareentwicklung." },
      { q: "Aus welchen drei Bereichen besteht eine Klasse im UML-Klassendiagramm?", a: "Klassenname (oben), Attribute (Mitte), Methoden/Operationen (unten).", svg: DIAGRAMS.klassendiagramm },
      { q: "Wie werden Sichtbarkeiten im Klassendiagramm notiert?", a: "+ = public, − = private, # = protected, ~ = package/paket-sichtbar.", svg: DIAGRAMS.sichtbarkeiten },
      { q: "Welche Beziehungsarten gibt es im Klassendiagramm und wie sehen sie aus?", a: "Assoziation (einfache Linie), Aggregation (Linie mit leerer Raute, 'hat-ein', lose Beziehung), Komposition (Linie mit gefüllter Raute, starke Abhängigkeit), Vererbung/Generalisierung (Linie mit leerem Dreieck-Pfeil).", svg: DIAGRAMS.beziehungsarten },
      { q: "Wie wird Kardinalität im Klassendiagramm dargestellt?", a: "An den Linienenden werden Zahlen/Bereiche notiert, z. B. 1, 0..1, 1..*, 0..* für die Anzahl möglicher Beziehungen zwischen den Klassen.", svg: DIAGRAMS.klassenkardinalitaet },
      { q: "Zeichne skizzenhaft: eine Klasse 'Kunde' die mehrere 'Bestellung'-Objekte hat (1:n).", a: "Zwei Rechtecke (Kunde, Bestellung) verbunden durch eine Linie mit Kardinalität '1' an Kunde und '0..*' an Bestellung, ggf. mit Raute für Aggregation/Komposition je nach Abhängigkeitsstärke.", svg: DIAGRAMS.kundebestellung }
    ]},
    { name: "Objektdiagramm, Use-Case, Aggregation/Komposition", prio: "mittel", cards: [
      { q: "Was ist der Unterschied zwischen Klassen- und Objektdiagramm?", a: "Klassendiagramm zeigt die generelle Struktur (Klassen, Beziehungen, Kardinalitäten). Objektdiagramm zeigt eine konkrete Momentaufnahme mit tatsächlichen Objektinstanzen und ihren Werten.", svg: DIAGRAMS.objektdiagramm },
      { q: "Was zeigt ein Use-Case-Diagramm?", a: "Die funktionalen Anforderungen eines Systems aus Nutzersicht: Akteure (Personen/Systeme) und die Anwendungsfälle (Use Cases), mit denen sie interagieren.", svg: DIAGRAMS.usecase },
      { q: "Was ist der Unterschied zwischen Aggregation und Komposition?", a: "Aggregation: lose 'hat-ein'-Beziehung, Teile können unabhängig vom Ganzen existieren (leere Raute). Komposition: starke Abhängigkeit, Teile existieren nur mit dem Ganzen und werden mit ihm zerstört (gefüllte Raute).", svg: DIAGRAMS.aggkomp },
      { q: "Was ist eine einfache Assoziation im Klassendiagramm und wie unterscheidet sie sich von Aggregation/Komposition?", a: "Eine Assoziation ist die allgemeinste, neutrale Beziehung zwischen zwei Klassen (einfache Linie ohne Raute) – sie sagt nur aus, dass ein Zusammenhang besteht, ohne Aussage über Besitzverhältnis oder Lebensdauer. Aggregation und Komposition sind speziellere Formen der Assoziation, die zusätzlich ein 'Ganzes-Teil'-Verhältnis mit unterschiedlicher Bindungsstärke ausdrücken." },
      { q: "Was ist der Unterschied zwischen Struktur- und Verhaltensdiagrammen in UML?", a: "Strukturdiagramme zeigen den statischen Aufbau eines Systems, z. B. Klassendiagramm, Objektdiagramm, Komponentendiagramm. Verhaltensdiagramme zeigen dynamische Abläufe/Interaktionen über Zeit, z. B. Use-Case-Diagramm, Sequenzdiagramm, Aktivitätsdiagramm, Zustandsdiagramm." },
      { q: "Zeichne/beschreibe ein etwas komplexeres Klassendiagramm-Beispiel: 'Bibliothek' verwaltet mehrere 'Buch'-Objekte, ein 'Buch' kann von einem 'Nutzer' ausgeliehen werden.", a: "Drei Klassen: Bibliothek (1) — Komposition (gefüllte Raute) — Buch (0..*): Bücher existieren nur als Teil der Bibliothek. Nutzer (0..*) — Assoziation (einfache Linie mit Kardinalität) — Buch (0..*): ein Nutzer kann mehrere Bücher ausleihen, ein Buch ist zu einem Zeitpunkt bei höchstens einem Nutzer (0..1 auf der Buch-Seite zur konkreten Ausleihe)." }
    ]},
    { name: "OOP vs. prozedural, Sichtbarkeiten", prio: "hoch", cards: [
      { q: "Was ist der grundlegende Unterschied zwischen objektorientierter und prozeduraler Programmierung?", a: "Prozedural: Programm als Abfolge von Funktionen/Prozeduren, die auf Daten zugreifen. Objektorientiert: Daten und zugehörige Funktionen werden in Objekten/Klassen gekapselt." },
      { q: "Erkläre die Sichtbarkeitsmodifikatoren public, private, protected.", a: "public: von überall zugreifbar. private: nur innerhalb der eigenen Klasse zugreifbar. protected: innerhalb der Klasse und ihrer Subklassen zugreifbar." },
      { q: "Was ist ein praktischer Vorteil der OOP gegenüber prozeduraler Programmierung?", a: "Bessere Wartbarkeit und Wiederverwendbarkeit durch Kapselung und Vererbung, klarere Modellierung realer Sachverhalte als Objekte." }
    ]},
    { name: "Programmierparadigmen", prio: "mittel", cards: [
      { q: "Nenne die wichtigsten Programmierparadigmen im Überblick.", a: "Imperativ/prozedural (Schritt-für-Schritt-Anweisungen), objektorientiert (Objekte/Klassen), funktional (Funktionen ohne Seiteneffekte), deklarativ (Beschreibung des 'Was', nicht des 'Wie', z. B. SQL)." },
      { q: "Was zeichnet funktionale Programmierung aus?", a: "Funktionen als zentrale Bausteine, Vermeidung von Seiteneffekten und veränderlichem Zustand, Funktionen können als Werte übergeben werden." },
      { q: "Nenne ein Beispiel für deklarative Programmierung.", a: "SQL: man beschreibt, welche Daten man haben möchte (SELECT ... WHERE ...), nicht wie die Datenbank sie beschafft." }
    ]},
    { name: "CIA-Schutzziele", prio: "hoch", cards: [
      { q: "Was bedeuten die drei CIA-Schutzziele?", a: "Confidentiality (Vertraulichkeit): kein unbefugter Zugriff. Integrity (Integrität): Schutz vor unbefugter Veränderung. Availability (Verfügbarkeit): Systeme/Daten sind bei Bedarf zugänglich.", svg: DIAGRAMS.ciatriade },
      { q: "Wie setzt man die CIA-Schutzziele am Beispiel eines Webservers konkret um?", a: "Vertraulichkeit: Verschlüsselung (TLS/HTTPS), Zugriffskontrollen. Integrität: Prüfsummen, Signaturen, Schutz vor Manipulation. Verfügbarkeit: Redundanz, Load Balancing, DDoS-Schutz, Backups." },
      { q: "Welche ergänzenden Schutzziele gibt es neben CIA?", a: "Authentizität (Echtheit des Absenders), Nachweisbarkeit/Verbindlichkeit (Non-Repudiation), teils auch Zurechenbarkeit." },
      { q: "Was passiert, wenn nur die Verfügbarkeit, aber nicht die Integrität geschützt ist?", a: "Das System bleibt erreichbar, aber Daten könnten unbemerkt manipuliert werden (z. B. durch einen Man-in-the-Middle-Angriff) – der Nutzer erhält falsche, aber verfügbare Informationen." }
    ]},
    { name: "DSGVO, Datenschutz vs. Datensicherheit", prio: "hoch", cards: [
      { q: "Wofür steht die Abkürzung DSGVO und seit wann gilt sie?", a: "Datenschutz-Grundverordnung. EU-weit unmittelbar geltende Verordnung zum Schutz personenbezogener Daten, in Kraft seit 25. Mai 2018." },
      { q: "Was ist der Unterschied zwischen Datenschutz und Datensicherheit?", a: "Datenschutz: Schutz personenbezogener Daten vor missbräuchlicher Verwendung (rechtlicher Fokus, z. B. DSGVO). Datensicherheit: technischer Schutz aller Daten vor Verlust, Manipulation, unbefugtem Zugriff (unabhängig vom Personenbezug)." },
      { q: "Was sind zentrale Grundsätze der DSGVO?", a: "Rechtmäßigkeit, Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung, Integrität/Vertraulichkeit, Rechenschaftspflicht.", svg: DIAGRAMS.dsgvo },
      { q: "Welche Rechte haben Betroffene nach der DSGVO?", a: "Auskunftsrecht, Recht auf Berichtigung, Recht auf Löschung ('Recht auf Vergessenwerden'), Recht auf Einschränkung der Verarbeitung, Datenübertragbarkeit, Widerspruchsrecht." },
      { q: "Was versteht man unter dem Recht auf informationelle Selbstbestimmung?", a: "Grundrecht (aus dem Volkszählungsurteil abgeleitet), wonach jeder selbst über die Preisgabe und Verwendung seiner personenbezogenen Daten bestimmen darf." }
    ]},
    { name: "Verschlüsselung, PKI", prio: "hoch", cards: [
      { q: "Was ist der Unterschied zwischen symmetrischer und asymmetrischer Verschlüsselung?", a: "Symmetrisch: ein gemeinsamer Schlüssel für Ver- und Entschlüsselung (z. B. AES) – schnell, aber Schlüsselaustausch ist heikel. Asymmetrisch: Schlüsselpaar aus öffentlichem und privatem Schlüssel (z. B. RSA) – sicherer Austausch, aber langsamer.", svg: DIAGRAMS.verschluesselung },
      { q: "Was ist eine PKI (Public Key Infrastructure)?", a: "System zur Verwaltung digitaler Zertifikate und Schlüssel, stellt sicher, dass ein öffentlicher Schlüssel eindeutig einer Identität zugeordnet werden kann.", svg: DIAGRAMS.pki },
      { q: "Welche Rollen gibt es innerhalb einer PKI?", a: "Zertifizierungsstelle (CA, stellt Zertifikate aus), Registrierungsstelle (RA, prüft Identitäten), Nutzer/Teilnehmer, Verzeichnisdienste (speichern/veröffentlichen Zertifikate)." },
      { q: "Wofür wird eine digitale Signatur verwendet?", a: "Zum Nachweis der Authentizität und Integrität eines Dokuments/einer Nachricht – erstellt mit dem privaten Schlüssel des Absenders, prüfbar mit dessen öffentlichem Schlüssel." },
      { q: "Was ist eine Hashfunktion und wofür wird sie in der IT-Sicherheit genutzt?", a: "Eine Einwegfunktion, die beliebig lange Eingaben auf einen Wert fester Länge (Hashwert/Prüfsumme) abbildet – nicht umkehrbar und kollisionsresistent (idealerweise). Anwendungen: Integritätsprüfung von Dateien/Nachrichten (Änderung erzeugt anderen Hash), sichere Passwortspeicherung (Speicherung des Hashes statt Klartext) und Grundlage digitaler Signaturen (signiert wird der Hash, nicht das ganze Dokument)." }
    ]},
    { name: "ITIL, ISMS, IT-Grundschutz", prio: "mittel", cards: [
      { q: "Was ist ITIL und wofür steht es?", a: "Framework für IT-Service-Management (ITSM), Fokus auf effiziente IT-Prozesse entlang des Service Lifecycle (Strategie, Design, Transition, Betrieb, kontinuierliche Verbesserung)." },
      { q: "Was ist ein ISMS und auf welcher Norm basiert es häufig?", a: "Informationssicherheits-Managementsystem: systematischer Ansatz zur Planung, Umsetzung, Überwachung und Verbesserung der Informationssicherheit, häufig basierend auf ISO/IEC 27001." },
      { q: "Was ist der IT-Grundschutz des BSI und welches Ziel verfolgt er?", a: "Standard des BSI für strukturierte, risikoorientierte Absicherung von IT-Systemen. Ziel: systematische Erhöhung von Vertraulichkeit, Integrität und Verfügbarkeit als Basis für Audits/Zertifizierungen." }
    ]},
    { name: "Vertragsarten", prio: "hoch", cards: [
      { q: "Was unterscheidet einen Werkvertrag von einem Dienstvertrag?", a: "Werkvertrag: geschuldet wird ein konkretes Ergebnis/Erfolg (z. B. fertige Software). Dienstvertrag: geschuldet wird die Tätigkeit/das Bemühen selbst, kein Erfolg garantiert (z. B. laufende Beratung, Wartung)." },
      { q: "Was ist ein Kaufvertrag und wodurch kommt er zustande?", a: "Vertrag über den Erwerb von Eigentum an einer Sache gegen Bezahlung. Zustandekommen durch übereinstimmende Willenserklärungen: Angebot und Annahme." },
      { q: "Nenne weitere IT-relevante Vertragstypen.", a: "Mietvertrag/Leasing (Nutzung von Hardware/Cloud gegen Entgelt), Lizenzvertrag (Nutzungsrechte an Software), Service Level Agreement/SLA (Qualität, Verfügbarkeit, Reaktionszeiten)." },
      { q: "Was sind typische Inhalte eines IT-Vertrags?", a: "Leistungsbeschreibung, Gegenleistung/Preis, Laufzeit und Kündigungsmodalitäten, Haftung und Gewährleistung, Datenschutz- und Sicherheitsanforderungen." }
    ]},
    { name: "Vertragszustandekommen", prio: "hoch", cards: [
      { q: "Wie kommt ein Vertrag rechtlich zustande?", a: "Durch zwei übereinstimmende Willenserklärungen: Angebot (Antrag) und Annahme." },
      { q: "Was bedeutet 'invitatio ad offerendum'?", a: "Aufforderung zur Abgabe eines Angebots (kein bindendes Angebot selbst), z. B. Schaufensterauslage oder Werbeanzeige – der Kunde gibt das eigentliche Angebot ab, der Verkäufer nimmt an oder lehnt ab." },
      { q: "Was passiert rechtlich bei einem Scherzgeschäft?", a: "Eine Willenserklärung ohne ernsthaften Rechtsbindungswillen, die der Erklärende in der Erwartung abgibt, der Mangel werde erkannt (§ 118 BGB) – die Erklärung ist nichtig, kann aber Schadensersatzpflicht auslösen, wenn der Empfänger auf die Ernsthaftigkeit vertraut hat." }
    ]},
    { name: "Ausbildungsvertrag, AGB, SLA", prio: "mittel", cards: [
      { q: "Was muss ein Ausbildungsvertrag mindestens enthalten?", a: "Art, Ziel und Dauer der Ausbildung, Ausbildungsort, Ausbildungsvergütung, Arbeitszeit, Probezeit, Urlaubsanspruch, Kündigungsvoraussetzungen." },
      { q: "Was sind AGB und wofür werden sie eingesetzt?", a: "Allgemeine Geschäftsbedingungen: vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt, um Massengeschäfte einheitlich zu regeln." },
      { q: "Was regelt ein SLA und was sind typische Inhalte?", a: "Service Level Agreement: Vereinbarung über Qualität, Verfügbarkeit, Reaktionszeiten und Support. Typisch: Uptime-Garantien, Performance-Kriterien, Eskalationsprozesse, Reporting." }
    ]},
    { name: "Bilanz Grundlagen", prio: "hoch", cards: [
      { q: "Was zeigt eine Bilanz und wie ist sie aufgebaut?", a: "Gegenüberstellung von Aktiva (Vermögen) und Passiva (Kapital) zu einem Stichtag. Aktiva: Anlagevermögen, Umlaufvermögen. Passiva: Eigenkapital, Fremdkapital.", svg: DIAGRAMS.bilanz },
      { q: "Nenne je zwei Beispiele für Anlagevermögen, Umlaufvermögen, Eigenkapital und Fremdkapital.", a: "Anlagevermögen: Maschinen, Gebäude. Umlaufvermögen: Kasse, Vorräte. Eigenkapital: Gezeichnetes Kapital, Gewinnrücklagen. Fremdkapital: Bankdarlehen, Verbindlichkeiten aus Lieferungen.", svg: DIAGRAMS.bilanzbeispiele },
      { q: "Wie wird eine Schenkung von 50.000€ per Überweisung in der Bilanz eingeordnet?", a: "Aktivseite: Erhöhung der Kasse/Bank (Umlaufvermögen). Passivseite: Erhöhung des Eigenkapitals (da kein Rückzahlungsanspruch besteht).", svg: DIAGRAMS.bilanzschenkung },
      { q: "Was besagt die Bilanzgleichung?", a: "Aktiva = Passiva, also Summe des Vermögens entspricht immer der Summe des Kapitals (Eigen- + Fremdkapital).", svg: DIAGRAMS.bilanzgleichung },
      { q: "Was ist der Unterschied zwischen Bilanz und Jahresabrechnung?", a: "Jahresabrechnung = Bilanz + Gewinn- und Verlustrechnung (GuV); gibt zusätzlich Aufschluss über den Geschäftserfolg der Periode, nicht nur den Vermögensstand am Stichtag." },
      { q: "Was ist ein Jahresabschluss und woraus besteht er?", a: "Der Jahresabschluss fasst am Ende eines Geschäftsjahres die wirtschaftliche Lage eines Unternehmens zusammen. Bestandteile bei Kapitalgesellschaften: Bilanz (Vermögens-/Kapitallage zum Stichtag), Gewinn- und Verlustrechnung/GuV (Erfolg der Periode) und Anhang; bei größeren Unternehmen zusätzlich Lagebericht." },
      { q: "Was sind Rechnungsabgrenzungsposten (RAP) und Rückstellungen?", a: "Rechnungsabgrenzungsposten: gleichen zeitliche Unterschiede zwischen Zahlung und wirtschaftlicher Zugehörigkeit einer Periode aus (z. B. im Dezember gezahlte Miete für Januar → aktiver RAP). Rückstellungen: Passivposten für ungewisse künftige Verpflichtungen, deren Höhe/Fälligkeit noch nicht sicher feststeht (z. B. Rückstellung für drohende Prozesskosten)." }
    ]},
    { name: "GuV, Deckungsbeitrag, Break-Even", prio: "mittel", cards: [
      { q: "Wie wird der Deckungsbeitrag berechnet und wofür wird er genutzt?", a: "Deckungsbeitrag = Erlöse − variable Kosten. Zeigt den Beitrag eines Produkts zur Deckung der fixen Kosten; Grundlage für Preiskalkulation und Produktrentabilität." },
      { q: "Was unterscheidet DB1, DB2 und DB3?", a: "Stufen der Deckungsbeitragsrechnung mit zunehmender Kostenzurechnung: DB1 (Stückebene), DB2 (Produktgruppenebene), DB3 (Gesamtunternehmensebene)." },
      { q: "Rechenbeispiel: Ein Produkt kostet 20€ variable Kosten und wird für 50€ verkauft, Fixkosten liegen bei 9.000€. Wie hoch ist der Deckungsbeitrag pro Stück und der Break-Even-Point?", a: "Deckungsbeitrag pro Stück = 50€ − 20€ = 30€. Break-Even-Point = Fixkosten / DB pro Stück = 9.000€ / 30€ = 300 Stück. Ab dem 301. verkauften Stück wird Gewinn erzielt." },
      { q: "Wie wird der Break-Even-Point berechnet?", a: "Break-Even-Point = Fixkosten / Deckungsbeitrag pro Stück. Punkt, an dem die Erlöse genau die Gesamtkosten decken (Gewinn = 0)." },
      { q: "Was sind Kostenarten und wie werden sie grob unterteilt?", a: "Kostenarten erfassen, welche Kosten in welcher Höhe angefallen sind. Grundunterteilungen: fixe Kosten (unabhängig von der Produktionsmenge, z. B. Miete) vs. variable Kosten (abhängig von der Menge, z. B. Materialkosten); sowie Einzelkosten (einem Produkt direkt zurechenbar, z. B. Material) vs. Gemeinkosten (nicht direkt zurechenbar, z. B. Verwaltung)." },
      { q: "Was sind Herstellungskosten und was zählt dazu?", a: "Alle Kosten, die direkt und indirekt der Herstellung eines Produkts zugerechnet werden: Materialeinzelkosten, Fertigungseinzelkosten sowie anteilige Material- und Fertigungsgemeinkosten. Vertriebs- und Verwaltungskosten zählen NICHT zu den Herstellungskosten." },
      { q: "Was zeigen Liquidität und Rentabilität und worin unterscheiden sie sich?", a: "Liquidität: Fähigkeit eines Unternehmens, seinen kurzfristigen Zahlungsverpflichtungen jederzeit nachzukommen (Zahlungsfähigkeit) – z. B. Liquidität 1./2./3. Grades als Kennzahlen. Rentabilität: Verhältnis von Gewinn zu eingesetztem Kapital, misst die Wirtschaftlichkeit (z. B. Eigenkapitalrentabilität, Gesamtkapitalrentabilität). Ein Unternehmen kann rentabel, aber trotzdem kurzfristig illiquide sein (und umgekehrt)." },
      { q: "Was ist der ROI (Return on Investment) und wie wird er berechnet?", a: "Kennzahl zur Beurteilung der Rentabilität einer Investition: ROI = Gewinn / eingesetztes Kapital (× 100 für Prozentwert). Zeigt, wie effizient eingesetztes Kapital Gewinn erwirtschaftet – wichtig für Investitionsentscheidungen und Wirtschaftlichkeitsvergleiche." }
    ]}
  ]
},
optional: {
  label: "Optional", range: "bei Zeit", color: "gray",
  topics: [
    { name: "Projektmanagement", prio: "niedrig", cards: [
      { q: "Was ist der Zweck der Netzplantechnik im Projektmanagement?", a: "Darstellung von Vorgängen, ihren Abhängigkeiten und zeitlichem Ablauf, um den kritischen Pfad (die zeitbestimmende Vorgangskette) zu ermitteln." },
      { q: "Was umfasst Projektcontrolling?", a: "Laufende Überwachung von Terminen, Kosten und Qualität eines Projekts sowie Steuerung bei Abweichungen vom Plan." },
      { q: "Was ist das 'Magische Dreieck' im Projektmanagement?", a: "Die drei zentralen, sich gegenseitig beeinflussenden Steuerungsgrößen eines Projekts: Zeit, Kosten und Qualität/Leistungsumfang. Eine Verbesserung einer Größe geht meist zulasten mindestens einer anderen (z. B. schnellere Fertigstellung → höhere Kosten oder geringerer Umfang).", svg: DIAGRAMS.magischesdreieck },
      { q: "Welche Ressourcen muss eine Projektleitung bei einem Projekt vor allem im Blick behalten?", a: "Personal (Verfügbarkeit, Qualifikation, Auslastung der Teammitglieder), Zeit (Termine, kritischer Pfad, Meilensteine) und Kosten (Budget, Kostenverfolgung, Abweichungsanalyse) – entspricht den drei Ecken des Magischen Dreiecks, ergänzt um die Steuerung von Risiken und Kommunikation im Projektteam." }
    ]},
    { name: "Systemanalyse/-entwurf", prio: "niedrig", cards: [
      { q: "Was ist Requirements Engineering?", a: "Systematisches Erheben, Dokumentieren, Prüfen und Verwalten von Anforderungen an ein System während der Analysephase." },
      { q: "Was ist der Unterschied zwischen Systemanalyse und Systementwurf?", a: "Systemanalyse: Erhebung und Beschreibung der Anforderungen ('Was' soll das System leisten). Systementwurf: konkrete technische Umsetzung/Architektur ('Wie' wird es realisiert)." }
    ]},
    { name: "Business Intelligence (Erweiterung)", prio: "niedrig", cards: [
      { q: "Was ist der AHP (Analytic Hierarchy Process)?", a: "Methode zur strukturierten Entscheidungsunterstützung durch paarweisen Vergleich von Kriterien und Alternativen zur Ableitung von Prioritäten." },
      { q: "Was ist ein Wissensmanagement-System?", a: "System zur Erfassung, Organisation und Bereitstellung von explizitem und implizitem Wissen innerhalb einer Organisation." }
    ]},
    { name: "E-Commerce", prio: "niedrig", cards: [
      { q: "Was ist der Unterschied zwischen clientbasierter und serverbasierter Interaktivität?", a: "Clientbasiert: Logik läuft im Browser des Nutzers (z. B. JavaScript) – schnelle Reaktion, keine Serverlast. Serverbasiert: Logik läuft auf dem Server, Ergebnis wird an den Client gesendet – zentrale Kontrolle, aber höhere Latenz." },
      { q: "Was ist ein CMS und wofür wird es genutzt?", a: "Content Management System: Software zur Erstellung, Verwaltung und Veröffentlichung digitaler Inhalte ohne tiefe Programmierkenntnisse (z. B. WordPress)." }
    ]},
    { name: "Workflow/DMS", prio: "niedrig", cards: [
      { q: "Was ist eine E-Akte und welchen Vorteil bringt sie?", a: "Elektronische Akte, die papierbasierte Verwaltungsakten ersetzt. Vorteile: schnellere Zugriffe, bessere Nachvollziehbarkeit, Platz-/Kosteneinsparung, Unterstützung mobiler Arbeit." },
      { q: "Was ist ein DMS?", a: "Dokumentenmanagementsystem: Verwaltung, Speicherung und Nachverfolgung digitaler Dokumente inkl. Versionierung, Metadaten und Workflow-Unterstützung." }
    ]},
    { name: "Volkswirtschaftslehre", prio: "niedrig", cards: [
      { q: "Was zeigt der einfache Wirtschaftskreislauf?", a: "Den Güter- und Geldfluss zwischen den Wirtschaftssubjekten, z. B. Haushalte liefern Produktionsfaktoren an Unternehmen und erhalten dafür Einkommen, Unternehmen liefern Güter gegen Konsumausgaben." },
      { q: "Nenne die drei klassischen Marktformen.", a: "Polypol (viele Anbieter, viele Nachfrager), Oligopol (wenige Anbieter), Monopol (ein Anbieter)." },
      { q: "Erkläre die drei Marktformen jeweils mit einem Beispiel und ihrer Preiswirkung.", a: "Polypol: viele kleine Anbieter, kein Einzelner beeinflusst den Preis, z. B. Wochenmarkt/Landwirtschaft → Preis bildet sich frei über Angebot/Nachfrage. Oligopol: wenige große Anbieter mit gegenseitiger Abhängigkeit, z. B. Mobilfunkanbieter/Tankstellen → Preise oft ähnlich, Gefahr von Absprachen. Monopol: ein einziger Anbieter ohne Konkurrenz, z. B. früher Deutsche Bahn im Fernverkehr, heute z. B. lokale Netzbetreiber → Anbieter kann Preis weitgehend selbst bestimmen (daher oft reguliert)." },
      { q: "Was versteht man unter dem Homo Oeconomicus?", a: "Modellannahme der Wirtschaftswissenschaften: ein rein rational handelnder Mensch, der über vollständige Informationen verfügt und stets versucht, seinen eigenen Nutzen (Gewinn/Zufriedenheit) zu maximieren. Dient als vereinfachtes Erklärungsmodell für ökonomisches Verhalten, wird aber wegen seiner Realitätsferne (Emotionen, begrenzte Rationalität) kritisiert." },
      { q: "Was besagt das Paretoprinzip (80/20-Regel)?", a: "Mit etwa 20% des Gesamtaufwands lassen sich bereits etwa 80% der Ergebnisse erzielen; die restlichen 20% der Ergebnisse erfordern unverhältnismäßig viel (80%) zusätzlichen Aufwand. Wird häufig zur Priorisierung genutzt (z. B. Fokus auf die wichtigsten 20% der Aufgaben/Kunden mit dem größten Wirkungsgrad)." },
      { q: "Was ist der Unterschied zwischen Effizienz und Effektivität?", a: "Effektivität: 'die richtigen Dinge tun' – das gesetzte Ziel wird erreicht, unabhängig vom Ressourcenaufwand. Effizienz: 'die Dinge richtig tun' – ein Ziel wird mit möglichst geringem Ressourcenaufwand (Zeit, Kosten, Personal) erreicht. Ein Vorgehen kann effektiv, aber ineffizient sein (Ziel erreicht, aber mit viel zu hohem Aufwand) und umgekehrt." }
    ]},
    { name: "Corporate Governance / Controlling", prio: "niedrig", cards: [
      { q: "Was versteht man unter Corporate Governance?", a: "Rahmenwerk aus Regeln und Prozessen zur verantwortungsvollen Leitung und Kontrolle eines Unternehmens, mit Fokus auf Transparenz und Interessenausgleich der Stakeholder." },
      { q: "Was ist die Aufgabe des Controllings?", a: "Planung, Steuerung und Kontrolle von Unternehmensprozessen anhand von Kennzahlen, um wirtschaftliche Ziele zu erreichen." }
    ]},
    { name: "IT-Grundschutz vertieft, ITSM", prio: "niedrig", cards: [
      { q: "Was regelt BSI-200-2 (Standard-Absicherung)?", a: "Vorgehensweise zur Umsetzung des IT-Grundschutzes mit standardisierten Sicherheitsmaßnahmen für normalen Schutzbedarf, als praktikabler Einstieg in die Informationssicherheit." },
      { q: "Was ist ITSM (IT-Servicemanagement)?", a: "Gesamtheit der Aktivitäten zur Planung, Bereitstellung und Steuerung von IT-Dienstleistungen, häufig nach dem ITIL-Framework organisiert." }
    ]},
    { name: "IT-Infrastruktur praktisch", prio: "niedrig", cards: [
      { q: "Was umfasst Nutzerrechteverwaltung?", a: "Zuweisung und Verwaltung von Zugriffsrechten für Nutzer auf Systeme/Ressourcen, meist rollenbasiert, um das Prinzip der minimalen Rechtevergabe umzusetzen." },
      { q: "Wie berechnet man aus einer CIDR-Angabe wie /26 die Anzahl nutzbarer Hosts?", a: "/26 bedeutet 6 Bit für Hosts (32-26=6) → 2^6 = 64 Adressen, davon 62 nutzbar (Netzwerk- und Broadcast-Adresse abgezogen)." }
    ]},
    { name: "Cloud praktisch", prio: "niedrig", cards: [
      { q: "Was ist eine 'Instanz' im Cloud-Kontext?", a: "Eine virtuelle Maschine, die bei einem Cloud-Anbieter gestartet wird, mit konfigurierbaren Ressourcen (CPU, RAM, Speicher, Betriebssystem)." },
      { q: "Was ist der Unterschied zwischen AWS Lambda und einer klassischen virtuellen Instanz?", a: "Lambda ist eine serverlose Funktion, die nur bei Bedarf ausgeführt wird und nach Ausführungszeit abgerechnet wird. Eine Instanz läuft dauerhaft und wird nach Laufzeit/Ressourcen abgerechnet, unabhängig von tatsächlicher Auslastung." }
    ]},

    { name: "Sonstige Einzelthemen", prio: "niedrig", cards: [
      { q: "Was bedeutet Normalisierung in Datenbanken?", a: "Strukturierung von Tabellen zur Vermeidung von Redundanzen und Anomalien, in aufeinander aufbauenden Normalformen (1NF, 2NF, 3NF)." },
      { q: "Erkläre die ersten drei Normalformen (1NF, 2NF, 3NF) jeweils kurz.", a: "1. Normalform (1NF): jedes Attribut enthält nur atomare (unteilbare) Werte, keine Wiederholungsgruppen/Listen in einer Zelle. 2. Normalform (2NF): erfüllt 1NF, zusätzlich müssen Nicht-Schlüsselattribute voll funktional vom gesamten Primärschlüssel abhängen (keine partielle Abhängigkeit bei zusammengesetzten Schlüsseln). 3. Normalform (3NF): erfüllt 2NF, zusätzlich dürfen Nicht-Schlüsselattribute nicht transitiv von anderen Nicht-Schlüsselattributen abhängen (kein Attribut hängt von einem anderen Nicht-Schlüsselattribut ab)." },
      { q: "Was besagt das Liskov Substitution Principle (LSP)?", a: "Objekte einer Subklasse müssen sich anstelle von Objekten der Superklasse einsetzen lassen, ohne die Korrektheit des Programms zu beeinträchtigen." }
    ]}
  ]
}
};

const rampMap = { blue: 'c-blue', purple: 'c-purple', teal: 'c-teal', coral: 'c-coral', gray: 'c-gray' };
const REINSERT_GAP = 6;
const STORAGE_KEY = 'mpp2_lernkarten_status_v1';

const root = document.getElementById('app');
let view = { screen: 'home' };
let session = null;
let pendingStart = null; // { weekKey, topicIdx } while filter picker is shown

// --- Persistent card status: 'neu' | 'lernen' | 'bekannt' ---
let cardStatus = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) cardStatus = JSON.parse(raw);
} catch(e) { cardStatus = {}; }

function saveStatus(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStatus)); } catch(e) {}
}

function cardId(wk, ti, ci){ return wk+'-'+ti+'-'+ci; }
function getStatus(wk, ti, ci){ return cardStatus[cardId(wk,ti,ci)] || 'neu'; }
function setStatus(wk, ti, ci, status){
  cardStatus[cardId(wk,ti,ci)] = status;
  saveStatus();
}

// scope === 'all' -> gesamten Fortschritt löschen; scope === weekKey -> nur diese Woche
function resetStatus(scope){
  if(scope === 'all'){
    cardStatus = {};
  } else {
    Object.keys(cardStatus).forEach(key=>{
      if(key.indexOf(scope + '-') === 0) delete cardStatus[key];
    });
  }
  saveStatus();
}

function statusCounts(topics, weekKey, topicIndices){
  const counts = { neu: 0, lernen: 0, bekannt: 0 };
  topics.forEach((t,i)=>{
    const ti = topicIndices ? topicIndices[i] : i;
    t.cards.forEach((c,ci)=>{
      counts[getStatus(weekKey,ti,ci)]++;
    });
  });
  return counts;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function buildSessionCards(weekKey, topicIdx, filter){
  const cards = [];
  if(weekKey === 'mix'){
    ['week1','week2','week3','optional'].forEach(wk=>{
      DATA[wk].topics.forEach((t,ti)=>t.cards.forEach((c,ci)=>{
        cards.push({ wk, ti, ci, topicName: t.name, card: c, status: 'open' });
      }));
    });
  } else {
    const w = DATA[weekKey];
    const topicIndices = topicIdx===null ? w.topics.map((_,i)=>i) : [topicIdx];
    topicIndices.forEach(ti=>{
      w.topics[ti].cards.forEach((c,ci)=>{
        cards.push({ wk: weekKey, ti, ci, topicName: w.topics[ti].name, card: c, status: 'open' });
      });
    });
  }
  // Shuffle whenever a session spans more than one topic, so repeated
  // starts of "alle Karten" don't always present the same fixed order.
  const spansMultipleTopics = weekKey === 'mix' || topicIdx === null;
  let result = cards;
  if(filter === 'unbekannt'){
    result = cards.filter(c => getStatus(c.wk,c.ti,c.ci) !== 'bekannt');
  } else if(filter === 'bekannt'){
    result = cards.filter(c => getStatus(c.wk,c.ti,c.ci) === 'bekannt');
  }
  if(spansMultipleTopics) shuffle(result);
  return result;
}

function startSession(weekKey, topicIdx, filter){
  const cards = buildSessionCards(weekKey, topicIdx, filter);
  if(cards.length === 0){
    session = { cards: [], queue: [], pos: 0, flipped: false, weekKey: weekKey, empty: true };
    view = { screen: 'cards' };
    render();
    return;
  }
  session = { cards, queue: [], pos: 0, flipped: false, weekKey: weekKey };
  session.queue = session.cards.map((_,i)=>i);
  view = { screen: 'cards' };
  render();
}

function currentSessionCard(){
  const idx = session.queue[session.pos];
  return session.cards[idx];
}

function countCards(topics){ return topics.reduce((s,t)=>s+t.cards.length,0); }

function render(){
  if(view.screen==='home') renderHome();
  else if(view.screen==='topics') renderTopics();
  else if(view.screen==='filter') renderFilterPicker();
  else if(view.screen==='cards') renderCards();
  else if(view.screen==='settings') renderSettings();
}

function statusBar(counts, total){
  if(total === 0) return '';
  const pctBekannt = Math.round(counts.bekannt/total*100);
  const pctLernen = Math.round(counts.lernen/total*100);
  return `<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--gray-50);">
    <div style="width:${pctBekannt}%;background:var(--teal-600);"></div>
    <div style="width:${pctLernen}%;background:var(--amber-600);"></div>
  </div>`;
}

function renderHome(){
  const keys = ['week1','week2','week3','optional'];
  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
    <button id="settings-btn" style="padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:6px;">&#9881; Fortschritt zurücksetzen</button>
  </div>`;
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  keys.forEach(k=>{
    const w = DATA[k];
    const total = countCards(w.topics);
    const counts = statusCounts(w.topics, k);
    const ramp = rampMap[w.color];
    html += `<div class="wk-card ${ramp}" data-key="${k}">
      <div style="width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="wk-title">${w.label}<span class="wk-range">${w.range}</span></div>
          <span class="icon">&#8250;</span>
        </div>
        <div class="wk-sub">${w.topics.length} Themen &middot; ${total} Karten</div>
        <div class="wk-sub" style="margin-top:4px;">${counts.bekannt} bekannt &middot; ${counts.lernen} in Arbeit &middot; ${counts.neu} neu</div>
        ${statusBar(counts, total)}
      </div>
    </div>`;
  });
  html += `<button id="mix-btn" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;">&#8646; Zufällige Wiederholung (alle Wochen)</button>`;
  html += '</div>';
  root.innerHTML = html;
  document.querySelectorAll('.wk-card').forEach(el=>{
    el.addEventListener('click', ()=>{ view = { screen:'topics', weekKey: el.dataset.key }; render(); });
  });
  document.getElementById('mix-btn').addEventListener('click', ()=>{ view = { screen:'filter', weekKey:'mix', topicIdx:null }; render(); });
  document.getElementById('settings-btn').addEventListener('click', ()=>{ view = { screen:'settings', confirmScope: null }; render(); });
}

function renderSettings(){
  const keys = ['week1','week2','week3','optional'];
  const confirmScope = view.confirmScope || null;

  let html = `<button id="back-home" class="back-btn">&larr; Übersicht</button>`;
  html += `<div style="font-size:18px;font-weight:600;margin-bottom:4px;">Fortschritt zurücksetzen</div>`;
  html += `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Setzt den gespeicherten Lernstatus (bekannt/in Arbeit) zurück. Die Karten selbst bleiben erhalten.</div>`;
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';

  keys.forEach(k=>{
    const w = DATA[k];
    const counts = statusCounts(w.topics, k);
    const total = countCards(w.topics);
    const isConfirming = confirmScope === k;
    html += `<div style="border:1px solid var(--gray-50);border-radius:10px;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:14px;font-weight:500;">${w.label}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${counts.bekannt} bekannt &middot; ${counts.lernen} in Arbeit &middot; ${counts.neu} neu (von ${total})</div>
        </div>
        ${isConfirming
          ? `<div style="display:flex;gap:6px;">
              <button id="cancel-${k}" style="padding:6px 10px;font-size:12px;">Abbrechen</button>
              <button id="confirm-${k}" class="btn-no" style="padding:6px 10px;font-size:12px;">Wirklich löschen</button>
            </div>`
          : `<button id="reset-${k}" style="padding:6px 10px;font-size:12px;" ${total===0?'disabled':''}>Zurücksetzen</button>`
        }
      </div>
    </div>`;
  });

  const isConfirmingAll = confirmScope === 'all';
  html += `<div style="border:1px solid var(--coral-50);border-radius:10px;padding:12px;margin-top:6px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:14px;font-weight:500;">Gesamter Fortschritt</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Setzt alle Wochen und den Optional-Block zurück.</div>
      </div>
      ${isConfirmingAll
        ? `<div style="display:flex;gap:6px;">
            <button id="cancel-all" style="padding:6px 10px;font-size:12px;">Abbrechen</button>
            <button id="confirm-all" class="btn-no" style="padding:6px 10px;font-size:12px;">Wirklich alles löschen</button>
          </div>`
        : `<button id="reset-all" style="padding:6px 10px;font-size:12px;">Alles zurücksetzen</button>`
      }
    </div>
  </div>`;

  html += '</div>';
  root.innerHTML = html;

  document.getElementById('back-home').addEventListener('click', ()=>{ view = { screen:'home' }; render(); });

  keys.forEach(k=>{
    const resetBtn = document.getElementById('reset-'+k);
    if(resetBtn) resetBtn.addEventListener('click', ()=>{ view = { screen:'settings', confirmScope: k }; render(); });
    const cancelBtn = document.getElementById('cancel-'+k);
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ view = { screen:'settings', confirmScope: null }; render(); });
    const confirmBtn = document.getElementById('confirm-'+k);
    if(confirmBtn) confirmBtn.addEventListener('click', ()=>{ resetStatus(k); view = { screen:'settings', confirmScope: null }; render(); });
  });

  const resetAllBtn = document.getElementById('reset-all');
  if(resetAllBtn) resetAllBtn.addEventListener('click', ()=>{ view = { screen:'settings', confirmScope: 'all' }; render(); });
  const cancelAllBtn = document.getElementById('cancel-all');
  if(cancelAllBtn) cancelAllBtn.addEventListener('click', ()=>{ view = { screen:'settings', confirmScope: null }; render(); });
  const confirmAllBtn = document.getElementById('confirm-all');
  if(confirmAllBtn) confirmAllBtn.addEventListener('click', ()=>{ resetStatus('all'); view = { screen:'settings', confirmScope: null }; render(); });
}

function renderTopics(){
  const w = DATA[view.weekKey];
  const prioClass = { hoch:'badge-hoch', mittel:'badge-mittel', niedrig:'badge-niedrig' };
  let html = `<button id="back-home" class="back-btn">&larr; Übersicht</button>`;
  html += `<div style="font-size:18px;font-weight:600;margin-bottom:4px;">${w.label} <span style="font-size:13px;font-weight:400;color:var(--text-secondary);">${w.range}</span></div>`;
  html += `<button id="start-week" style="margin:8px 0 16px;width:100%;">&#9654; Alle Karten dieser Woche starten</button>`;
  html += '<div>';
  w.topics.forEach((t,ti)=>{
    const counts = statusCounts([t], view.weekKey, [ti]);
    html += `<div class="topic-row" data-ti="${ti}">
      <div style="width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:14px;font-weight:500;">${t.name}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="badge ${prioClass[t.prio]}">${t.prio}</span>
            <span class="icon">&#8250;</span>
          </div>
        </div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${t.cards.length} Karten &middot; ${counts.bekannt} bekannt &middot; ${counts.lernen} in Arbeit &middot; ${counts.neu} neu</div>
        ${statusBar(counts, t.cards.length)}
      </div>
    </div>`;
  });
  html += '</div>';
  root.innerHTML = html;
  document.getElementById('back-home').addEventListener('click', ()=>{ view={screen:'home'}; render(); });
  document.getElementById('start-week').addEventListener('click', ()=>{ view = { screen:'filter', weekKey: view.weekKey, topicIdx: null }; render(); });
  document.querySelectorAll('.topic-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ti = parseInt(el.dataset.ti);
      view = { screen:'filter', weekKey: view.weekKey, topicIdx: ti };
      render();
    });
  });
}

function renderFilterPicker(){
  const weekKey = view.weekKey;
  const topicIdx = view.topicIdx;
  const allCards = buildSessionCards(weekKey, topicIdx, 'alle');
  const unbekanntCards = buildSessionCards(weekKey, topicIdx, 'unbekannt');
  const bekanntCards = buildSessionCards(weekKey, topicIdx, 'bekannt');

  let contextLabel = 'Zufällige Wiederholung';
  if(weekKey !== 'mix'){
    contextLabel = topicIdx===null ? DATA[weekKey].label : DATA[weekKey].topics[topicIdx].name;
  }

  const backTarget = weekKey === 'mix' ? 'home' : 'topics';
  let html = `<button id="back-btn" class="back-btn">&larr; ${weekKey==='mix' ? 'Übersicht' : 'Themen'}</button>`;
  html += `<div style="font-size:16px;font-weight:600;margin-bottom:14px;">${contextLabel}</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:10px;">
    <button id="f-alle" style="text-align:left;padding:14px;">
      <div style="font-weight:500;font-size:14px;">Alle Karten</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${allCards.length} Karten</div>
    </button>
    <button id="f-unbekannt" style="text-align:left;padding:14px;" ${unbekanntCards.length===0?'disabled':''}>
      <div style="font-weight:500;font-size:14px;">Nur was ich noch nicht kann</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${unbekanntCards.length} Karten (neu + in Arbeit)</div>
    </button>
    <button id="f-bekannt" style="text-align:left;padding:14px;" ${bekanntCards.length===0?'disabled':''}>
      <div style="font-weight:500;font-size:14px;">Bekanntes wiederholen</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${bekanntCards.length} Karten</div>
    </button>
  </div>`;
  root.innerHTML = html;
  document.getElementById('back-btn').addEventListener('click', ()=>{
    view = weekKey === 'mix' ? {screen:'home'} : {screen:'topics', weekKey: weekKey};
    render();
  });
  document.getElementById('f-alle').addEventListener('click', ()=>startSession(weekKey, topicIdx, 'alle'));
  document.getElementById('f-unbekannt').addEventListener('click', ()=>startSession(weekKey, topicIdx, 'unbekannt'));
  document.getElementById('f-bekannt').addEventListener('click', ()=>startSession(weekKey, topicIdx, 'bekannt'));
}

function renderCards(){
  if(session.empty){
    let html = `<button id="back-btn" class="back-btn">&larr; Zurück</button>`;
    html += `<div class="done-box" style="background:var(--gray-50);color:var(--gray-800);">
      <div style="font-size:16px;font-weight:600;">Keine Karten in dieser Auswahl</div>
      <div style="font-size:13px;margin-top:6px;">Wähle einen anderen Filter.</div>
    </div>`;
    root.innerHTML = html;
    document.getElementById('back-btn').addEventListener('click', goBackFromSession);
    return;
  }
  if(session.pos >= session.queue.length){
    renderSessionDone();
    return;
  }
  const item = currentSessionCard();
  const openCount = session.queue.length - session.pos;
  const doneCount = session.cards.filter(c=>c.status==='done').length;
  const retryCount = session.cards.filter(c=>c.status==='retry').length;
  const backLabel = (session.weekKey && session.weekKey !== 'mix') ? 'Themen' : 'Übersicht';
  const priorStatus = getStatus(item.wk, item.ti, item.ci);
  const priorLabel = { neu: 'Neu', lernen: 'Zuletzt: nicht gewusst', bekannt: 'Zuletzt: gewusst' }[priorStatus];
  const priorClass = { neu: 'c-gray', lernen: 'c-amber', bekannt: 'c-teal' }[priorStatus];

  let html = `<button id="back-btn" class="back-btn">&larr; ${backLabel}</button>`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <div style="font-size:13px;color:var(--text-secondary);">${item.topicName}</div>
    <span class="badge ${priorClass}" style="font-size:10px;">${priorLabel}</span>
  </div>`;
  html += `<div class="stat-row"><span>${openCount} offen</span><span>${retryCount} in Wiederholung</span><span>${doneCount} geschafft</span></div>`;
  const showSvg = session.flipped && item.card.svg;
  html += `<div id="flip-card" class="flip-card">
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">${session.flipped ? 'MUSTERLÖSUNG' : 'FRAGE'}</div>
    <div style="font-size:16px;line-height:1.6;">${session.flipped ? item.card.a : item.card.q}</div>
    ${showSvg ? `<div style="margin-top:14px;background:var(--bg);border-radius:8px;padding:10px;">${item.card.svg}</div>` : ''}
    <div style="font-size:12px;color:var(--text-muted);margin-top:16px;text-align:center;">${session.flipped ? '' : 'Antippen für Musterlösung'}</div>
  </div>`;
  if(session.flipped){
    html += `<div class="btn-row">
      <button id="no-btn" class="btn-no">&#10005; Nicht gewusst</button>
      <button id="yes-btn" class="btn-yes">&#10003; Gewusst</button>
    </div>`;
  } else {
    html += `<div style="margin-top:14px;"><button id="flip-hint-btn" style="width:100%;">Karte umdrehen</button></div>`;
  }
  root.innerHTML = html;
  document.getElementById('back-btn').addEventListener('click', goBackFromSession);
  document.getElementById('flip-card').addEventListener('click', flipCard);
  const flipHintBtn = document.getElementById('flip-hint-btn');
  if(flipHintBtn) flipHintBtn.addEventListener('click', flipCard);
  const yesBtn = document.getElementById('yes-btn');
  const noBtn = document.getElementById('no-btn');
  if(yesBtn) yesBtn.addEventListener('click', ()=>answer(true));
  if(noBtn) noBtn.addEventListener('click', ()=>answer(false));
}

function flipCard(){ session.flipped = !session.flipped; render(); }

function goBackFromSession(){
  if(session && session.weekKey && session.weekKey !== 'mix'){
    view = { screen: 'topics', weekKey: session.weekKey };
  } else {
    view = { screen: 'home' };
  }
  render();
}

function answer(knew){
  const idx = session.queue[session.pos];
  const item = session.cards[idx];
  if(knew){
    session.cards[idx].status = 'done';
    setStatus(item.wk, item.ti, item.ci, 'bekannt');
    session.pos++;
  } else {
    session.cards[idx].status = 'retry';
    setStatus(item.wk, item.ti, item.ci, 'lernen');
    const reinsertAt = Math.min(session.pos + 1 + REINSERT_GAP, session.queue.length);
    session.queue.splice(reinsertAt, 0, idx);
    session.pos++;
  }
  session.flipped = false;
  render();
}

function renderSessionDone(){
  const total = session.cards.length;
  const backLabel = (session.weekKey && session.weekKey !== 'mix') ? 'Themen' : 'Übersicht';
  let html = `<button id="back-btn" class="back-btn">&larr; ${backLabel}</button>`;
  html += `<div class="done-box">
    <div style="font-size:28px;">&#10003;</div>
    <div style="font-size:16px;font-weight:600;margin-top:10px;">Durchgang abgeschlossen</div>
    <div style="font-size:13px;margin-top:4px;">${total} Karten gewusst</div>
  </div>`;
  html += `<button id="restart-btn" style="margin-top:16px;width:100%;">Nochmal von vorn</button>`;
  root.innerHTML = html;
  document.getElementById('back-btn').addEventListener('click', goBackFromSession);
  document.getElementById('restart-btn').addEventListener('click', ()=>{
    session.queue = session.cards.map((_,i)=>i);
    session.cards.forEach(c=>c.status='open');
    session.pos = 0;
    session.flipped = false;
    render();
  });
}

render();
</script>
